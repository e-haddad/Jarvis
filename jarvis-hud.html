<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="apple-touch-icon" href="/static/icon.png">
<title>JARVIS HUD</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070d;
    --bg-elev: #07090f;
    --ink: #e8ecf2;
    --ink-dim: #8b94a8;
    --ink-fainter: #4b5468;
    --ok: #46d486;
    --ok-glow: rgba(70,212,134,0.35);
    --err: #ff5c6c;
    --err-glow: rgba(255,92,108,0.35);
    --hair: rgba(255,255,255,0.06);
    --hair-strong: rgba(255,255,255,0.10);
    --accent: oklch(0.70 0.18 252);
    --accent-rgb: 64 142 255;
    --accent-soft: oklch(0.70 0.18 252 / 0.16);
    --accent-faint: oklch(0.70 0.18 252 / 0.06);
    --accent-glow: oklch(0.70 0.18 252 / 0.28);
    --state-standby: oklch(0.50 0.02 250);
    --state-listening: oklch(0.74 0.16 152);
    --state-thinking: oklch(0.72 0.18 252);
    --state-speaking: oklch(0.78 0.14 220);
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --font-ui: -apple-system, "SF Pro Display", "SF Pro Text", BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif;
    --font-mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, monospace;
    --font-chat: "Newsreader", "Geist", "SF Pro Display", -apple-system, system-ui, serif;
  }
  [data-theme="sonnet"] {
    --accent: oklch(0.68 0.27 18);
    --accent-rgb: 255 64 96;
    --accent-soft: oklch(0.68 0.27 18 / 0.22);
    --accent-faint: oklch(0.68 0.27 18 / 0.09);
    --accent-glow: oklch(0.68 0.27 18 / 0.48);
    --state-thinking: oklch(0.70 0.26 18);
    --state-speaking: oklch(0.76 0.20 22);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    height: 100%; overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    letter-spacing: -0.01em;
  }
  #app { position: fixed; inset: 0; transition: background 1.2s var(--ease); }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 50%, rgb(var(--accent-rgb) / 0.06) 0%, rgb(var(--accent-rgb) / 0.02) 35%, transparent 70%),
      radial-gradient(ellipse 120% 100% at 50% 50%, transparent 40%, rgba(0,0,0,0.55) 90%, rgba(0,0,0,0.85) 100%),
      var(--bg);
    transition: background 1.2s var(--ease);
  }
  .bg-grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(to right, rgb(var(--accent-rgb) / 0.055) 1px, transparent 1px), linear-gradient(to bottom, rgb(var(--accent-rgb) / 0.055) 1px, transparent 1px);
    background-size: 64px 64px; background-position: center center;
    mask-image: radial-gradient(ellipse 75% 80% at 50% 50%, #000 25%, transparent 95%);
    -webkit-mask-image: radial-gradient(ellipse 75% 80% at 50% 50%, #000 25%, transparent 95%);
    transition: background-image 1.2s var(--ease);
  }
  .bg-grid-fine {
    position: absolute; inset: 0;
    background-image: linear-gradient(to right, rgb(var(--accent-rgb) / 0.025) 1px, transparent 1px), linear-gradient(to bottom, rgb(var(--accent-rgb) / 0.025) 1px, transparent 1px);
    background-size: 16px 16px; background-position: center center;
    mask-image: radial-gradient(ellipse 55% 60% at 50% 50%, #000 0%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse 55% 60% at 50% 50%, #000 0%, transparent 80%);
  }
  .bg-noise {
    position: absolute; inset: 0; opacity: 0.04; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/></svg>");
  }
  .corner {
    position: absolute; font-family: var(--font-mono); font-size: 10.5px;
    color: var(--ink-fainter); letter-spacing: 0.18em; font-weight: 500;
    user-select: none; opacity: 0; animation: fade-up 0.9s var(--ease-out) 0.4s forwards;
  }
  .corner.tl { top: 22px; left: 28px; }
  .corner.tr { top: 22px; right: 28px; }
  .corner.bl { bottom: 22px; left: 28px; }
  .corner.br { bottom: 22px; right: 28px; }
  @keyframes fade-up { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes panel-in {
    from { opacity: 0; transform: translateY(8px) scale(0.995); filter: blur(6px); }
    to   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }
  .ring-wrap {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 520px; height: 520px; pointer-events: none;
    opacity: 0; animation: ring-in 1.2s var(--ease-out) 0.1s forwards;
  }
  @keyframes ring-in {
    from { opacity: 0; transform: translate(-50%, -50%) scale(0.94); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  .ring-svg { width: 100%; height: 100%; overflow: visible; }
  .ring-bloom {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 50%, var(--accent-glow) 0%, rgb(var(--accent-rgb) / 0.10) 22%, transparent 55%);
    filter: blur(20px); opacity: 0.7;
    transition: opacity 0.6s var(--ease), background 1.2s var(--ease);
  }
  [data-state="listening"] .ring-bloom { opacity: 0.9; }
  [data-state="thinking"]  .ring-bloom { opacity: 1.0; }
  [data-state="speaking"]  .ring-bloom { opacity: 1.1; }
  .tick-rotate-cw  { animation: spin 36s linear infinite; transform-origin: 50% 50%; }
  .tick-rotate-ccw { animation: spin 60s linear infinite reverse; transform-origin: 50% 50%; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .arc-listen-a { animation: spin 4s linear infinite; transform-origin: 50% 50%; }
  .arc-listen-b { animation: spin 6.4s linear infinite reverse; transform-origin: 50% 50%; }
  .orbit-thinking { animation: spin 2.2s linear infinite; transform-origin: 50% 50%; }
  .thinking-arc-a { animation: spin 3.5s linear infinite; transform-origin: 50% 50%; }
  .thinking-arc-b { animation: spin 5s linear infinite reverse; transform-origin: 50% 50%; }
  .wave-ring { transform-origin: 50% 50%; animation: wave-pulse 2.4s ease-out infinite; opacity: 0; }
  .wave-ring.w2 { animation-delay: 0.8s; }
  .wave-ring.w3 { animation-delay: 1.6s; }
  @keyframes wave-pulse { 0% { transform: scale(1.0); opacity: 0.55; } 100% { transform: scale(1.18); opacity: 0; } }
  .standby-pulse { animation: breathe 6s ease-in-out infinite; transform-origin: 50% 50%; }
  @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.85; } }
  .center-label {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    text-align: center; pointer-events: none;
    opacity: 0; animation: fade-in 0.8s var(--ease-out) 0.4s forwards;
  }
  .center-label .name {
    font-family: var(--font-ui); font-weight: 200; font-size: 38px;
    letter-spacing: 0.42em; margin-right: -0.42em; color: var(--ink);
    text-shadow: 0 0 24px rgb(var(--accent-rgb) / 0.35);
  }
  .center-label .status {
    margin-top: 12px; font-family: var(--font-mono); font-size: 10.5px;
    font-weight: 500; letter-spacing: 0.32em; color: var(--ink-dim);
    display: inline-flex; align-items: center; gap: 8px; transition: color 0.4s var(--ease);
  }
  .center-label .status .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--state-standby); box-shadow: 0 0 8px currentColor; transition: background 0.4s var(--ease);
  }
  [data-state="listening"] .center-label .status .dot { background: var(--state-listening); }
  [data-state="thinking"]  .center-label .status .dot { background: var(--state-thinking); animation: pulse-dot 1.2s ease-in-out infinite; }
  [data-state="speaking"]  .center-label .status .dot { background: var(--state-speaking); }
  @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .panel {
    position: absolute;
    background: linear-gradient(180deg, rgba(12,15,22,0.72) 0%, rgba(8,11,18,0.68) 100%);
    backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border: 1px solid var(--hair); border-radius: 10px;
    box-shadow: 0 1px 0 0 rgba(255,255,255,0.04) inset, 0 24px 60px -20px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.35);
    overflow: hidden; opacity: 0; animation: panel-in 0.7s var(--ease-out) forwards;
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .panel.resizing { transition: none !important; user-select: none; }
  .panel-resize {
    position: absolute; right: 0; bottom: 0;
    width: 18px; height: 18px;
    cursor: nwse-resize;
    z-index: 5;
    display: flex; align-items: flex-end; justify-content: flex-end;
    padding: 3px;
    opacity: 0.35; transition: opacity 0.2s var(--ease);
  }
  .panel:hover .panel-resize { opacity: 0.75; }
  .panel-resize:hover { opacity: 1; }
  .panel-resize::before {
    content: "";
    width: 9px; height: 9px;
    background:
      linear-gradient(135deg, transparent 0 55%, rgb(var(--accent-rgb) / 0.85) 56% 62%, transparent 63% 73%, rgb(var(--accent-rgb) / 0.85) 74% 80%, transparent 81% 100%);
  }
  .panel.delay-1 { animation-delay: 0.15s; }
  .panel.delay-2 { animation-delay: 0.25s; }
  .panel.delay-3 { animation-delay: 0.35s; }
  .panel.delay-4 { animation-delay: 0.45s; }
  .panel::before, .panel::after, .panel > .corner-br-a, .panel > .corner-br-b {
    content: ""; position: absolute; width: 10px; height: 10px;
    border: 1px solid rgb(var(--accent-rgb) / 0.45); pointer-events: none; transition: border-color 1.2s var(--ease);
  }
  .panel::before { top: -1px; left: -1px;  border-right: none; border-bottom: none; border-top-left-radius: 10px; }
  .panel::after  { top: -1px; right: -1px; border-left: none;  border-bottom: none; border-top-right-radius: 10px; }
  .panel > .corner-br-a { bottom: -1px; left: -1px;  border-right: none; border-top: none; border-bottom-left-radius: 10px; }
  .panel > .corner-br-b { bottom: -1px; right: -1px; border-left: none;  border-top: none; border-bottom-right-radius: 10px; }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px 12px; border-bottom: 1px solid var(--hair); cursor: grab; user-select: none;
    flex-shrink: 0;
  }
  .panel-head:active { cursor: grabbing; }
  .panel-title {
    font-family: var(--font-mono); font-size: 10px; font-weight: 600;
    color: var(--ink); letter-spacing: 0.24em; display: flex; align-items: center; gap: 10px;
  }
  .panel-title .glyph {
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow); transition: background 0.6s var(--ease), box-shadow 0.6s var(--ease);
  }
  .panel-head .drag-hint { font-family: var(--font-mono); font-size: 9px; color: var(--ink-fainter); letter-spacing: 0.2em; }
  .panel-body {
    padding: 14px 18px 16px;
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column;
  }
  .panel-body::-webkit-scrollbar { width: 4px; }
  .panel-body::-webkit-scrollbar-thumb { background: rgb(var(--accent-rgb) / 0.20); border-radius: 2px; }
  .sys-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 0; font-family: var(--font-mono); font-size: 13px;
    border-bottom: 1px solid rgba(255,255,255,0.025);
  }
  .sys-row:last-child { border-bottom: none; }
  .sys-row .k { color: var(--ink-dim); letter-spacing: 0.18em; font-weight: 500; }
  .sys-row .v { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 500; }
  .sys-row .v.accent { color: var(--accent); transition: color 0.8s var(--ease); }
  .sys-row .v.ok { color: oklch(0.78 0.14 152); }
  .sys-row .v.warn { color: oklch(0.82 0.13 90); }
  .sys-row .v.clickable { cursor: pointer; transition: filter 0.2s var(--ease); }
  .sys-row .v.clickable:hover { filter: brightness(1.3); }
  .conv-list {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 10px;
    padding-right: 4px; margin-right: -4px;
  }
  .conv-list::-webkit-scrollbar { width: 4px; }
  .conv-list::-webkit-scrollbar-thumb { background: rgb(var(--accent-rgb) / 0.25); border-radius: 2px; }
  .conv-entry {
    padding: 10px 12px 11px; border-radius: 6px;
    border-left: 2px solid var(--hair-strong); background: rgba(255,255,255,0.015);
  }
  .conv-entry.jarvis { border-left-color: var(--accent); background: rgb(var(--accent-rgb) / 0.05); }
  .conv-meta {
    display: flex; align-items: center; gap: 8px; font-family: var(--font-mono);
    font-size: 10.5px; letter-spacing: 0.18em; color: var(--ink-fainter); margin-bottom: 6px;
  }
  .conv-meta .role { color: var(--ink-dim); font-weight: 600; }
  .conv-entry.jarvis .role { color: var(--accent); transition: color 0.8s var(--ease); }
  .conv-text {
    font-family: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, monospace;
    font-size: 14px; color: var(--ink);
    line-height: 1.55; letter-spacing: 0.005em; text-wrap: pretty;
    font-weight: 400;
  }
  .conv-entry.jarvis .conv-text { font-weight: 400; color: #f0f3f8; }
  .conv-text.tool-msg {
    font-size: 12px; opacity: 0.45; color: var(--ink-dim);
  }
  .conv-text .typing-cursor {
    display: inline-block; animation: blink-cursor 1s step-end infinite;
  }
  @keyframes blink-cursor {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }
  .agent-row {
    display: flex; align-items: center; gap: 12px; padding: 9px 0;
    font-family: var(--font-mono); font-size: 12.5px; border-bottom: 1px solid rgba(255,255,255,0.025);
    transition: opacity 0.4s var(--ease);
  }
  .agent-row:last-child { border-bottom: none; }
  /* Status indicator: 14px box; idle/active show a dot via ::before, done/timeout show a glyph */
  .agent-row .pip {
    width: 14px; height: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 11px; line-height: 1; font-weight: 700; transition: color 0.3s var(--ease);
  }
  .agent-row .pip::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--ink-fainter); transition: all 0.3s var(--ease);
  }
  .agent-row.active .pip::before {
    background: var(--accent); box-shadow: 0 0 10px var(--accent-glow);
    animation: agent-pulse 1.1s var(--ease) infinite;
  }
  .agent-row.done .pip::before, .agent-row.timeout .pip::before { display: none; }
  .agent-row.done .pip { color: var(--ok); text-shadow: 0 0 8px var(--ok-glow); }
  .agent-row.timeout .pip { color: var(--err); text-shadow: 0 0 8px var(--err-glow); }
  .agent-row .agent-meta { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .agent-row .name { color: var(--ink-dim); letter-spacing: 0.16em; font-weight: 700; transition: color 0.3s var(--ease); }
  .agent-row .desc {
    font-size: 9.5px; letter-spacing: 0.04em; color: var(--ink-fainter); font-weight: 400;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.3s var(--ease);
  }
  .agent-row.active .name { color: var(--ink); }
  .agent-row.active .desc { color: var(--ink-dim); }
  .agent-row.done .name, .agent-row.timeout .name { color: var(--ink-dim); }
  .agent-row.idle.used { opacity: 0.78; }
  .agent-row .ts {
    color: var(--ink-fainter); font-variant-numeric: tabular-nums; font-size: 10px;
    letter-spacing: 0.1em; flex-shrink: 0; transition: color 0.3s var(--ease);
  }
  .agent-row.active .ts { color: var(--accent); }
  .agent-row.done .ts { color: var(--ok); }
  .agent-row.timeout .ts { color: var(--err); }
  @keyframes agent-pulse {
    0%, 100% { box-shadow: 0 0 5px var(--accent-glow); transform: scale(1);   opacity: 1; }
    50%      { box-shadow: 0 0 14px var(--accent-glow); transform: scale(1.25); opacity: 0.5; }
  }
  /* Panel header right cluster (count + badge + drag hint) */
  .panel-head-right { display: flex; align-items: center; gap: 9px; }
  .agent-count {
    font-family: var(--font-mono); font-size: 9px; font-weight: 700; letter-spacing: 0.18em;
    color: var(--ink-fainter); transition: color 0.3s var(--ease);
  }
  .agent-count.running { color: var(--accent); }
  .parallel-badge {
    font-family: var(--font-mono); font-size: 8px; font-weight: 700; letter-spacing: 0.22em;
    color: var(--accent); padding: 2px 6px; border: 1px solid var(--accent-soft);
    border-radius: 3px; background: var(--accent-faint); box-shadow: 0 0 10px var(--accent-glow);
    transition: opacity 0.8s var(--ease); opacity: 1;
  }
  .parallel-badge.fading { opacity: 0; }
  .usage-card { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.025); }
  .usage-card:last-child { border-bottom: none; }
  .usage-card .label { font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); letter-spacing: 0.2em; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .usage-card .value { font-family: var(--font-ui); font-size: 26px; font-weight: 300; color: var(--ink); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-bottom: 8px; }
  .usage-card .bar { height: 3px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; }
  .usage-card .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 2px; box-shadow: 0 0 8px var(--accent-glow); transition: width 0.8s var(--ease), background 0.8s var(--ease); }
  .usage-card .sub { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-fainter); margin-top: 6px; letter-spacing: 0.12em; }
  .top-badge {
    position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
    font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.32em;
    padding: 7px 16px; border-radius: 999px; color: var(--accent);
    background: rgb(var(--accent-rgb) / 0.06); border: 1px solid rgb(var(--accent-rgb) / 0.25);
    backdrop-filter: blur(16px); display: inline-flex; align-items: center; gap: 8px;
    opacity: 0; transform: translate(-50%, -8px);
    transition: opacity 0.5s var(--ease), transform 0.5s var(--ease), color 0.8s var(--ease), background 0.8s var(--ease), border-color 0.8s var(--ease);
  }
  .top-badge.show { opacity: 1; transform: translate(-50%, 0); }
  .top-badge .pip { width: 5px; height: 5px; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px currentColor; }

  /* Top-center clock — prominent, bold */
  .top-clock {
    position: fixed; top: 18px; left: 0; right: 0;
    margin: 0 auto; width: max-content;
    display: inline-flex; align-items: baseline; gap: 14px;
    font-family: var(--font-mono); color: var(--ink);
    z-index: 25; user-select: none; pointer-events: none;
    opacity: 0; animation: clock-in 0.9s var(--ease-out) 0.55s forwards;
  }
  @keyframes clock-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  /* Nudge clock down when top-badge is visible so they don't overlap */
  .top-badge.show ~ .top-clock { top: 56px; }
  .top-clock-container {
    background: rgba(4, 7, 15, 0.92);
    border: 1px solid var(--hair);
    border-radius: 28px;
    padding: 8px 18px 10px;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .top-clock .hms {
    font-size: 36px; font-weight: 700; letter-spacing: 0.14em;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    text-shadow: 0 0 22px rgb(var(--accent-rgb) / 0.45), 0 0 2px rgb(var(--accent-rgb) / 0.6);
    transition: color 0.6s var(--ease), text-shadow 0.6s var(--ease);
  }
  .top-clock .meridiem {
    font-size: 13px; font-weight: 600; letter-spacing: 0.32em;
    color: var(--accent); opacity: 0.85;
    transition: color 0.6s var(--ease);
  }
  .top-clock-date {
    font-size: 11px; font-weight: 500; letter-spacing: 0.18em;
    color: var(--ink); opacity: 0.55;
    font-family: var(--font-mono);
  }
  .top-clock-weather {
    font-size: 12px; font-weight: 500;
    color: var(--ink); opacity: 0.7;
    font-family: var(--font-mono);
  }
  .top-clock-calendar {
    font-size: 11px; font-weight: 500;

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const STATE_LABELS = { standby: "STANDBY", listening: "LISTENING", thinking: "THINKING", speaking: "SPEAKING" };

const AGENTS_LIST = [
  { id: "researcher", name: "RESEARCHER", desc: "web search, URL fetch, synthesis" },
  { id: "architect",  name: "ARCHITECT",  desc: "designs solutions, plans" },
  { id: "coder",      name: "CODER",      desc: "implements via Claude Code" },
  { id: "career",     name: "CAREER",     desc: "jobs, resume, outreach" },
  { id: "projects",   name: "PROJECTS",   desc: "Jarvis, ChipIn, Billed, Iris" },
  { id: "iris",       name: "IRIS",       desc: "smart home, Pi, gesture" },
  { id: "finance",    name: "FINANCE",    desc: "crypto, spending, portfolio" },
  { id: "general",    name: "GENERAL",    desc: "everything else" },
];

// ── Clock ──────────────────────────────────────────────────────────────────────
function useClock() {
  const [now, setNow] = useState(new Date());
  const start = useRef(Date.now());
  useEffect(() => { const id = setInterval(() => setNow(new Date()), 1000); return () => clearInterval(id); }, []);
  const pad = n => String(n).padStart(2, "0");
  const h12 = now.getHours() % 12 || 12;
  const ap = now.getHours() >= 12 ? "PM" : "AM";
  const time = `${h12}:${pad(now.getMinutes())}:${pad(now.getSeconds())} ${ap}`;
  const upSec = Math.floor((Date.now() - start.current) / 1000);
  const uptime = `${pad(Math.floor(upSec/3600))}:${pad(Math.floor((upSec%3600)/60))}:${pad(upSec%60)}`;
  return { time, uptime };
}

// ── WebSocket hook ─────────────────────────────────────────────────────────────
function useJarvisWS(handlers) {
  const [wsState, setWsState] = useState("disconnected"); // connected | disconnected | error
  const wsRef = useRef(null);
  const handlersRef = useRef(handlers);
  handlersRef.current = handlers;

  const connect = useCallback(() => {
    const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
    const url = `${proto}//${window.location.host}/ws`;
    const ws = new WebSocket(url);
    wsRef.current = ws;

    ws.onopen = () => setWsState("connected");
    ws.onclose = () => {
      setWsState("disconnected");
      setTimeout(connect, 2000); // auto-reconnect
    };
    ws.onerror = () => setWsState("error");
    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        handlersRef.current(msg);
      } catch {}
    };
  }, []);

  useEffect(() => { connect(); return () => wsRef.current?.close(); }, [connect]);

  const send = useCallback((data) => {
    if (wsRef.current?.readyState === WebSocket.OPEN) {
      wsRef.current.send(JSON.stringify(data));
    }
  }, []);

  return { wsState, send };
}

// ── Boot ───────────────────────────────────────────────────────────────────────
function Boot({ onDone }) {
  const [gone, setGone] = useState(false);
  useEffect(() => {
    const t1 = setTimeout(() => setGone(true), 3400);
    const t2 = setTimeout(() => onDone(), 4300);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, []);
  return (
    <div className={`boot ${gone ? "gone" : ""}`}>
      <div className="boot-glyph"></div>
      <div className="boot-line l1">JARVIS · PHASE 5</div>
      <div className="boot-line l2">INITIALIZING SUBSYSTEMS</div>
      <div className="boot-line l3">ALL SYSTEMS NOMINAL</div>
    </div>
  );
}

// ── Ring ───────────────────────────────────────────────────────────────────────
const Ring = ({ state }) => {
  const cx = 260, cy = 260;
  const R = { outer: 200, ticks: 180, main: 156, mid: 124, inner: 96, core: 68 };
  const ticks = React.useMemo(() => {
    const arr = [];
    for (let i = 0; i < 60; i++) arr.push({ angle: (i*360)/60, len: i%5===0?8:4, opacity: i%5===0?0.55:0.18 });
    return arr;
  }, []);
  const innerDashes = React.useMemo(() => { const arr=[]; for(let i=0;i<64;i++) arr.push((i*360)/64); return arr; }, []);
  const pt = (r, a) => { const rad=(a-90)*Math.PI/180; return [cx+r*Math.cos(rad), cy+r*Math.sin(rad)]; };
  const arc = (r, s, sw) => { const [x1,y1]=pt(r,s),[x2,y2]=pt(r,s+sw),la=sw>180?1:0; return `M ${x1} ${y1} A ${r} ${r} 0 ${la} 1 ${x2} ${y2}`; };
  return (
    <div className="ring-wrap">
      <div className="ring-bloom" />
      <svg className="ring-svg" viewBox="0 0 520 520" fill="none">
        <defs>
          <filter id="ring-glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <radialGradient id="core-grad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stopColor="rgb(var(--accent-rgb))" stopOpacity="0.04"/>
            <stop offset="60%" stopColor="rgb(var(--accent-rgb))" stopOpacity="0.02"/>
            <stop offset="100%" stopColor="rgb(var(--accent-rgb))" stopOpacity="0"/>
          </radialGradient>
        </defs>
        <circle cx={cx} cy={cy} r={R.core+30} fill="url(#core-grad)"/>
        <circle cx={cx} cy={cy} r={R.outer} stroke="rgb(var(--accent-rgb) / 0.18)" strokeWidth="0.75"/>
        <g className="tick-rotate-cw">
          {ticks.map((t,i) => { const [x1,y1]=pt(R.ticks-t.len/2,t.angle),[x2,y2]=pt(R.ticks+t.len/2,t.angle); return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="rgb(var(--accent-rgb))" strokeOpacity={t.opacity} strokeWidth={t.angle%30===0?1.2:0.75} strokeLinecap="round"/>; })}
          {[0,90,180,270].map((deg,i) => { const [x,y]=pt(R.ticks,deg); return <circle key={i} cx={x} cy={y} r="2.4" fill="rgb(var(--accent-rgb))" fillOpacity="0.9"/>; })}
        </g>
        <g className="tick-rotate-ccw">
          {[45,135,225,315].map((deg,i) => { const [x1,y1]=pt(R.main+6,deg),[x2,y2]=pt(R.main+18,deg); return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="rgb(var(--accent-rgb))" strokeOpacity="0.5" strokeWidth="1" strokeLinecap="round"/>; })}
        </g>
        <g filter="url(#ring-glow)">
          {state==="standby" && <circle className="standby-pulse" cx={cx} cy={cy} r={R.main} stroke="rgb(var(--accent-rgb))" strokeOpacity="0.7" strokeWidth="1.25"/>}
          {state==="listening" && <>
            <circle cx={cx} cy={cy} r={R.main} stroke="rgb(var(--accent-rgb))" strokeOpacity="0.55" strokeWidth="1.25"/>
            <g className="arc-listen-a"><path d={arc(R.main,0,36)} stroke="rgb(var(--accent-rgb))" strokeWidth="2" strokeLinecap="round" strokeOpacity="0.95"/></g>
            <g className="arc-listen-b"><path d={arc(R.main,180,24)} stroke="rgb(var(--accent-rgb))" strokeWidth="1.5" strokeLinecap="round" strokeOpacity="0.7"/></g>
          </>}
          {state==="thinking" && <>
            <g className="thinking-arc-a"><path d={arc(R.main,0,220)} stroke="rgb(var(--accent-rgb))" strokeWidth="1.5" strokeLinecap="round" strokeOpacity="0.9"/></g>
            <g className="thinking-arc-b"><path d={arc(R.main,0,70)} stroke="rgb(var(--accent-rgb))" strokeWidth="1" strokeLinecap="round" strokeOpacity="0.5"/></g>
            <g className="orbit-thinking"><circle cx={cx+R.main} cy={cy} r="3.5" fill="rgb(var(--accent-rgb))" fillOpacity="1"/><circle cx={cx+R.main} cy={cy} r="8" fill="rgb(var(--accent-rgb))" fillOpacity="0.18"/></g>
          </>}
          {state==="speaking" && <>
            <circle cx={cx} cy={cy} r={R.main} stroke="rgb(var(--accent-rgb))" strokeOpacity="0.85" strokeWidth="1.5"/>
            <circle className="wave-ring" cx={cx} cy={cy} r={R.main} stroke="rgb(var(--accent-rgb))" strokeOpacity="0.5" strokeWidth="1.2"/>
            <circle className="wave-ring w2" cx={cx} cy={cy} r={R.main} stroke="rgb(var(--accent-rgb))" strokeOpacity="0.5" strokeWidth="1.2"/>
            <circle className="wave-ring w3" cx={cx} cy={cy} r={R.main} stroke="rgb(var(--accent-rgb))" strokeOpacity="0.5" strokeWidth="1.2"/>
          </>}
        </g>
        <circle cx={cx} cy={cy} r={R.mid} stroke="rgb(var(--accent-rgb) / 0.12)" strokeWidth="0.5"/>
        {innerDashes.map((deg,i) => { const [x1,y1]=pt(R.inner,deg-1.2),[x2,y2]=pt(R.inner,deg+1.2); return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke="rgb(var(--accent-rgb))" strokeOpacity="0.32" strokeWidth="0.75" strokeLinecap="round"/>; })}
        <circle cx={cx} cy={cy} r={R.core} stroke="rgb(var(--accent-rgb) / 0.15)" strokeWidth="0.5"/>
      </svg>
    </div>
  );
};

// ── Panel shell ────────────────────────────────────────────────────────────────
const Panel = ({ title, x, y, w, h, delayClass, children, onDrag, onResize, onFocus, z, minW = 240, minH = 160, maxW = 900, maxH = 1200, headerExtra = null }) => {
  const ref = useRef(null);
  const drag = useRef(null);
  const resz = useRef(null);
  const [resizing, setResizing] = useState(false);

  // ── Drag ──
  const startDrag = (clientX, clientY) => {
    if (!ref.current) return;
    const rect = ref.current.getBoundingClientRect();
    drag.current = { offX: clientX - rect.left, offY: clientY - rect.top };
  };
  // Clamp x/y so the panel stays fully within the viewport (with a small inset)
  const clampPos = (x, y) => {
    if (!ref.current) return [x, y];
    const r = ref.current.getBoundingClientRect();
    const pad = 8;
    const maxX = Math.max(pad, window.innerWidth  - r.width  - pad);
    const maxY = Math.max(pad, window.innerHeight - r.height - pad);
    return [
      Math.min(Math.max(pad, x), maxX),
      Math.min(Math.max(pad, y), maxY),
    ];
  };
  const onMouseDown = (e) => {
    startDrag(e.clientX, e.clientY);
    const onMove = (ev) => { if (drag.current) { const [cx, cy] = clampPos(ev.clientX - drag.current.offX, ev.clientY - drag.current.offY); onDrag(cx, cy); } };
    const onUp = () => { drag.current = null; window.removeEventListener("mousemove", onMove); window.removeEventListener("mouseup", onUp); };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  };
  const onTouchStart = (e) => {
    const t = e.touches[0];
    startDrag(t.clientX, t.clientY);
    const onMove = (ev) => { if (drag.current) { ev.preventDefault(); const tt=ev.touches[0]; const [cx, cy] = clampPos(tt.clientX - drag.current.offX, tt.clientY - drag.current.offY); onDrag(cx, cy); } };
    const onEnd = () => { drag.current = null; window.removeEventListener("touchmove", onMove); window.removeEventListener("touchend", onEnd); };
    window.addEventListener("touchmove", onMove, { passive: false });
    window.addEventListener("touchend", onEnd);
  };

  // ── Resize (bottom-right grip) ──
  const startResize = (clientX, clientY) => {
    if (!ref.current) return;
    const rect = ref.current.getBoundingClientRect();
    resz.current = { startX: clientX, startY: clientY, startW: rect.width, startH: rect.height };
  };
  const applyResize = (clientX, clientY) => {
    if (!resz.current || !onResize) return;
    let nw = Math.min(maxW, Math.max(minW, resz.current.startW + (clientX - resz.current.startX)));
    let nh = Math.min(maxH, Math.max(minH, resz.current.startH + (clientY - resz.current.startY)));
    // Don't allow the panel to grow off the right/bottom edge
    if (ref.current) {
      const r = ref.current.getBoundingClientRect();
      const pad = 8;
      nw = Math.min(nw, Math.max(minW, window.innerWidth  - r.left - pad));
      nh = Math.min(nh, Math.max(minH, window.innerHeight - r.top  - pad));
    }
    onResize(nw, nh);
  };
  const onResizeMouseDown = (e) => {
    e.preventDefault(); e.stopPropagation();
    startResize(e.clientX, e.clientY);
    setResizing(true);
    const onMove = (ev) => applyResize(ev.clientX, ev.clientY);
    const onUp = () => {
      resz.current = null; setResizing(false);
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  };
  const onResizeTouchStart = (e) => {
    e.stopPropagation();
    const t = e.touches[0];
    startResize(t.clientX, t.clientY);
    setResizing(true);
    const onMove = (ev) => { ev.preventDefault(); const tt = ev.touches[0]; applyResize(tt.clientX, tt.clientY); };
    const onEnd = () => {
      resz.current = null; setResizing(false);
      window.removeEventListener("touchmove", onMove);
      window.removeEventListener("touchend", onEnd);
    };
    window.addEventListener("touchmove", onMove, { passive: false });
    window.addEventListener("touchend", onEnd);
  };

  const style = { left: x, top: y, width: w };
  if (h) style.height = h;
  if (z != null) style.zIndex = z;

  const bringToFront = (e) => { if (onFocus) onFocus(); };

  return (
    <div ref={ref}
         className={`panel ${delayClass||""} ${resizing ? "resizing" : ""}`}
         style={style}
         onMouseDownCapture={bringToFront}
         onTouchStartCapture={bringToFront}>
      <div className="corner-br-a"></div><div className="corner-br-b"></div>
      <div className="panel-head" onMouseDown={onMouseDown} onTouchStart={onTouchStart}>
        <div className="panel-title"><span className="glyph"></span>{title}</div>
        <div className="panel-head-right">
          {headerExtra}
          <div className="drag-hint">DRAG</div>
        </div>
      </div>
      <div className="panel-body">{children}</div>
      {onResize && (
        <div
          className="panel-resize"
          onMouseDown={onResizeMouseDown}
          onTouchStart={onResizeTouchStart}
          title="Drag to resize"
        ></div>
      )}
    </div>
  );
};

// ── Conversation panel (with input embedded) ───────────────────────────────────
const isToolMessage = (text) => {
  const patterns = ["Running ", "✓ Ran", "Searching:", "Reading ", "Using ", "Fetching ", "Tool:", "→", "✓ ", "Writing ", "..."];
  return patterns.some(p => text.includes(p));
};

const ConversationPanel = ({ pos, size, onDrag, onResize, onFocus, z, entries, onSend, visible }) => {
  if (!visible) return null;
  const listRef = useRef(null);
  const [val, setVal] = useState("");
  const typingRef = useRef({ text: "", index: 0, timer: null, entryIdx: -1 });
  const [, forceUpdate] = useState({});

  useEffect(() => { if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight; }, [entries.length]);

  // Typing animation for Jarvis messages
  useEffect(() => {
    const lastEntry = entries[entries.length - 1];
    if (!lastEntry || lastEntry.role !== "jarvis") return;

    const entryIdx = entries.length - 1;
    const fullText = lastEntry.text;

    // If this is a tool message, render instantly
    if (isToolMessage(fullText)) {
      if (typingRef.current.timer) clearInterval(typingRef.current.timer);
      typingRef.current = { text: fullText, index: fullText.length, timer: null, entryIdx };
      forceUpdate({});
      return;
    }

    // If already typing, complete current message immediately
    if (typingRef.current.timer) {
      clearInterval(typingRef.current.timer);
      if (typingRef.current.entryIdx >= 0 && typingRef.current.entryIdx < entries.length) {
        const prevEntry = entries[typingRef.current.entryIdx];
        if (prevEntry) typingRef.current.text = prevEntry.text;
      }
    }

    // Start typing new message
    typingRef.current = { text: "", index: 0, timer: null, entryIdx };
    forceUpdate({});

    const timer = setInterval(() => {
      typingRef.current.index++;
      typingRef.current.text = fullText.slice(0, typingRef.current.index);
      forceUpdate({});

      if (typingRef.current.index >= fullText.length) {
        clearInterval(timer);
        typingRef.current.timer = null;
      }
    }, 18);

    typingRef.current.timer = timer;
    return () => { if (timer) clearInterval(timer); };
  }, [entries]);

  const submit = () => { if (val.trim()) { onSend(val.trim()); setVal(""); } };
  const onKey = (e) => { if (e.key === "Enter") submit(); };

  return (
    <Panel title="CONVERSATION" x={pos.x} y={pos.y} w={size.w} h={size.h} onDrag={onDrag} onResize={onResize} onFocus={onFocus} z={z}
           minW={320} minH={260} maxW={900} maxH={1100} delayClass="delay-2">
      <div className="conv-list" ref={listRef}>
        {entries.length === 0 && <div className="conv-empty">Waiting for input...</div>}
        {entries.map((e, i) => {
          const isJarvis = e.role === "jarvis";
          const isTyping = isJarvis && typingRef.current.entryIdx === i && typingRef.current.timer;
          const displayText = isJarvis && typingRef.current.entryIdx === i ? typingRef.current.text : e.text;
          const isToolMsg = isToolMessage(e.text);

          // Skip rendering tool messages entirely
          if (isToolMsg) return null;

          return (
            <div key={i} className={`conv-entry ${e.role}`}>
              <div className="conv-meta">
                <span className="role">{e.role === "jarvis" ? "JARVIS" : "EDWARD"}</span>
                <span>·</span><span>{e.ts}</span>
              </div>
              <div className="conv-text">
                {displayText}
                {isTyping && <span className="typing-cursor">|</span>}
              </div>
            </div>
          );
        })}
      </div>
      <div className="conv-input-row">
        <input
          className="conv-input"
          placeholder="Type a message..."
          value={val}
          onChange={e => setVal(e.target.value)}
          onKeyDown={onKey}
        />
        <button className="conv-send" onClick={submit}>SEND</button>
      </div>
    </Panel>
  );
};

// ── Agent panel ────────────────────────────────────────────────────────────────
// `agents` is a map: { [id]: { status: "active"|"done"|"timeout"|"idle", elapsed, lastUsed } }
const AgentPanel = ({ pos, size, onDrag, onResize, onFocus, z, agents, visible }) => {
  const activeCount = AGENTS_LIST.reduce((n, a) => n + ((agents[a.id]?.status === "active") ? 1 : 0), 0);

  // PARALLEL badge: shows once 2+ agents run at once, fades out 3s after all complete.
  const [badgeShow, setBadgeShow]   = useState(false);
  const [badgeFading, setBadgeFading] = useState(false);
  const timers = useRef([]);
  const clearTimers = () => { timers.current.forEach(clearTimeout); timers.current = []; };
  useEffect(() => {
    if (activeCount >= 2) {
      clearTimers();
      setBadgeShow(true);
      setBadgeFading(false);
    } else if (activeCount === 0 && badgeShow && !badgeFading) {
      clearTimers();
      timers.current.push(setTimeout(() => {
        setBadgeFading(true);
        timers.current.push(setTimeout(() => { setBadgeShow(false); setBadgeFading(false); }, 900));
      }, 3000));
    }
  }, [activeCount, badgeShow, badgeFading]);
  useEffect(() => clearTimers, []);

  // Keep the most recently active agent scrolled into view.
  const activeRef = useRef(null);
  useEffect(() => {
    if (activeRef.current) activeRef.current.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }, [activeCount]);

  if (!visible) return null;

  const countLabel = activeCount > 0 ? `${activeCount} / 8 ACTIVE` : "IDLE";
  const headerExtra = (
    <>
      {badgeShow && <span className={`parallel-badge ${badgeFading ? "fading" : ""}`}>PARALLEL</span>}
      <span className={`agent-count ${activeCount > 0 ? "running" : ""}`}>{countLabel}</span>
    </>
  );

  return (
  <Panel title="AGENTS" x={pos.x} y={pos.y} w={size.w} h={size.h} onDrag={onDrag} onResize={onResize} onFocus={onFocus} z={z}
         minW={240} minH={200} maxW={480} maxH={700} delayClass="delay-3" headerExtra={headerExtra}>
    {AGENTS_LIST.map(a => {
      const st     = agents[a.id] || {};
      const status = st.status || "idle";
      const used   = !!st.lastUsed;
      let tsLabel = "—";
      if      (status === "active")  tsLabel = "RUN";
      else if (status === "done")    tsLabel = (st.elapsed != null ? `${st.elapsed}s` : "DONE");
      else if (status === "timeout") tsLabel = "TIMEOUT";
      else if (used)                 tsLabel = st.lastUsed;
      const pipGlyph = status === "done" ? "✓" : status === "timeout" ? "✕" : "";
      return (
        <div key={a.id}
             ref={status === "active" ? activeRef : null}
             className={`agent-row ${status} ${used ? "used" : ""}`}>
          <span className="pip">{pipGlyph}</span>
          <div className="agent-meta">
            <span className="name">{a.name}</span>
            <span className="desc">{a.desc}</span>
          </div>
          <span className="ts">{tsLabel}</span>
        </div>
      );
    })}
  </Panel>
  );
};

// ── Top-center clock ──────────────────────────────────────────────────────────────
const TopClock = ({ time }) => {
  // time looks like "02:14:37 PM" — split numerals from meridiem
  const m = (time || "").match(/^(\d{2}:\d{2}:\d{2})(?:\s+(AM|PM))?$/i);
  const hms = m ? m[1] : (time || "");
  const mer = m && m[2] ? m[2] : "";

  const [date, setDate] = useState("");
  const [weather, setWeather] = useState("—");
  const [calendar, setCalendar] = useState("📅 No events today");
  const [bitcoin, setBitcoin] = useState("₿ —");

  // ── Date formatting ──
  useEffect(() => {
    const updateDate = () => {
      const now = new Date();
      const days = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];
      const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
      const day = days[now.getDay()];
      const month = months[now.getMonth()];
      const dateNum = now.getDate();
      setDate(`${day}, ${month} ${dateNum}`);
    };
    updateDate();
    const id = setInterval(updateDate, 60000); // Update every minute
    return () => clearInterval(id);
  }, []);

  // ── Weather from Open-Meteo ──
  useEffect(() => {
    const weatherCodeToEmoji = (code) => {
      if (code === 0) return "☀️";
      if (code >= 1 && code <= 3) return "⛅";
      if (code >= 45 && code <= 48) return "🌫️";
      if (code >= 51 && code <= 67) return "🌧️";
      if (code >= 71 && code <= 77) return "❄️";
      if (code >= 80 && code <= 82) return "🌦️";
      if (code >= 95 && code <= 99) return "⛈️";
      return "☁️";
    };

    const fetchWeather = async () => {
      try {
        const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=42.4898&longitude=-83.1457&current=temperature_2m,weather_code&temperature_unit=celsius");
        const data = await res.json();
        const temp = Math.round(data.current.temperature_2m);
        const icon = weatherCodeToEmoji(data.current.weather_code);
        setWeather(`${icon} ${temp}°C`);
      } catch {
        setWeather("—");
      }
    };

    fetchWeather();
    const id = setInterval(fetchWeather, 30 * 60 * 1000); // Every 30 minutes
    return () => clearInterval(id);
  }, []);

  // ── Calendar next event ──
  useEffect(() => {
    const fetchCalendar = async () => {
      try {
        const res = await fetch("/calendar/next-event");
        const data = await res.json();
        if (!data || !data.summary) {
          setCalendar("📅 No events today");
          return;
        }
        // Truncate title at 20 chars
        const summary = data.summary.length > 20 ? data.summary.slice(0, 20) + "…" : data.summary;
        setCalendar(`📅 ${summary}`);
      } catch {
        setCalendar("📅 No events today");
      }
    };

    fetchCalendar();
    const id = setInterval(fetchCalendar, 5 * 60 * 1000); // Every 5 minutes
    return () => clearInterval(id);
  }, []);

  // ── Bitcoin price ──
  useEffect(() => {
    const fetchBitcoin = async () => {
      try {
        const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true");
        const data = await res.json();
        const price = data.bitcoin.usd;
        const change = data.bitcoin.usd_24h_change;
        const priceStr = price.toLocaleString("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 0, maximumFractionDigits: 0 });
        const arrow = change >= 0 ? "▲" : "▼";
        const changeClass = change >= 0 ? "up" : "down";
        const changeStr = Math.abs(change).toFixed(1);
        setBitcoin(<>₿ {priceStr} <span className={changeClass}>{arrow} {changeStr}%</span></>);
      } catch {
        setBitcoin("₿ —");
      }
    };

    fetchBitcoin();
    const id = setInterval(fetchBitcoin, 5 * 60 * 1000); // Every 5 minutes
    return () => clearInterval(id);
  }, []);

  return (
    <div className="top-clock" aria-label="Current time">
      <div className="top-clock-container">
        <div style={{ display: "flex", alignItems: "baseline", gap: "14px" }}>
          <span className="hms">{hms}</span>
          {mer && <span className="meridiem">{mer}</span>}
        </div>
        <div className="top-clock-date">{date}</div>
        <div className="top-clock-weather">{weather}</div>
        <div className="top-clock-calendar">{calendar}</div>
        <div className="top-clock-bitcoin">{bitcoin}</div>
      </div>
    </div>
  );
};

// ── Spotify Panel ──────────────────────────────────────────────────────────────
const SpotifyPanel = ({ pos, size, onDrag, onResize, onFocus, z, visible }) => {
  const [track, setTrack] = React.useState(null);
  const [isPlaying, setIsPlaying] = React.useState(false);

  const fetchNowPlaying = React.useCallback(async () => {
    try {
      const res = await fetch("/spotify/now-playing");
      if (!res.ok) { setTrack(null); return; }
      const data = await res.json();
      setTrack(data);
      setIsPlaying(data?.is_playing ?? false);
    } catch { setTrack(null); }
  }, []);

  React.useEffect(() => {
    if (!visible) return;
    fetchNowPlaying();
    const id = setInterval(fetchNowPlaying, 5000);
    return () => clearInterval(id);
  }, [visible, fetchNowPlaying]);

  const control = async (action) => {
    try {
      await fetch(`/spotify/${action}`, { method: "POST" });
      setTimeout(fetchNowPlaying, 300);
    } catch {}
  };

  const fmtTime = (ms) => {
    const s = Math.floor(ms / 1000);
    return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  };

  if (!visible) return null;

  return (
    <Panel title="NOW PLAYING" x={pos.x} y={pos.y} w={size.w} h={size.h} onDrag={onDrag} onResize={onResize} onFocus={onFocus} z={z}
           minW={220} minH={300} maxW={480} maxH={780} delayClass="delay-4">
      {!track ? (
        <div className="spotify-idle">NOTHING PLAYING</div>
      ) : (
        <>
          {track.art ? (
            <img className="spotify-art" src={track.art} alt={track.album} />
          ) : (
            <div className="spotify-art-placeholder">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="rgb(var(--accent-rgb))">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
              </svg>
            </div>
          )}
          <div className="spotify-track" title={track.name}>{track.name}</div>
          <div className="spotify-artist" title={track.artist}>{track.artist}</div>
          {track.duration > 0 && (
            <div className="spotify-progress">
              <div className="spotify-bar">
                <div className="spotify-bar-fill" style={{width: `${(track.progress/track.duration)*100}%`}}></div>
              </div>
              <div className="spotify-times">
                <span>{fmtTime(track.progress)}</span>
                <span>{fmtTime(track.duration)}</span>
              </div>
            </div>
          )}
          <div className="spotify-controls">
            <button className="spotify-btn" onClick={() => control("previous")} title="Previous">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
            </button>
            <button className={`spotify-btn play`} onClick={() => control(isPlaying ? "pause" : "play")} title={isPlaying ? "Pause" : "Play"}>
              {isPlaying ? (
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
              ) : (
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              )}
            </button>
            <button className="spotify-btn" onClick={() => control("next")} title="Next">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg>
            </button>
          </div>
        </>
      )}
    </Panel>
  );
};


// ── Timer Panel ────────────────────────────────────────────────────────────────
const TimerPanel = ({ id, message, totalSeconds, startedAt, onDone }) => {
  const RADIUS = 34;
  const CIRC   = 2 * Math.PI * RADIUS;

  const [remaining, setRemaining] = React.useState(() =>
    Math.max(0, totalSeconds - Math.floor((Date.now() - startedAt) / 1000))
  );
  const [done, setDone] = React.useState(false);

  React.useEffect(() => {
    if (done) return;
    const id = setInterval(() => {
      setRemaining(r => {
        if (r <= 1) {
          clearInterval(id);
          setDone(true);
          setTimeout(() => onDone(), 1800);
          return 0;
        }
        return r - 1;
      });
    }, 1000);
    return () => clearInterval(id);
  }, [done]);

  const pct      = remaining / totalSeconds;
  const offset   = CIRC * (1 - pct);
  const expiring = remaining <= 60 && !done;

  const fmt = (s) => {
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (h > 0) return `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
    return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
  };

  return (
    <div className={`timer-panel ${expiring ? "expiring" : ""} ${done ? "done" : ""}`}>
      <div className="timer-header">
        <span className="pip"></span>
        <span className="timer-title">{message.toUpperCase()}</span>
      </div>
      <div className="timer-ring-wrap">
        <svg className="timer-ring-svg" viewBox="0 0 80 80">
          <circle className="timer-ring-bg" cx="40" cy="40" r={RADIUS}/>
          <circle className="timer-ring-fg" cx="40" cy="40" r={RADIUS}
            strokeDasharray={CIRC}
            strokeDashoffset={done ? CIRC : offset}
          />
        </svg>
        <div className="timer-countdown">{done ? "✓" : fmt(remaining)}</div>
      </div>
      <div className="timer-label">{done ? "DONE" : "REMAINING"}</div>
    </div>
  );
};

// Avengers Canvas Component
const AvengersCanvas = ({ agentEvents }) => {
  const canvasRef = useRef(null);
  const spritesRef = useRef(new Map()); // Map<agentName, sprite> - max 8 sprites
  const animationRef = useRef(null);
  const trailsRef = useRef([]); // Trail particles: { x, y, color, opacity, life, maxLife }

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");

    // Resize canvas to match window
    const resize = () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    };
    resize();
    window.addEventListener("resize", resize);

    // Animation loop
    const animate = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const now = Date.now();

      // Update and draw trails
      trailsRef.current = trailsRef.current.filter(t => {
        t.life--;
        t.opacity = t.life / t.maxLife;
        if (t.life <= 0) return false;
        ctx.fillStyle = t.color;
        ctx.globalAlpha = t.opacity;
        ctx.fillRect(t.x, t.y, t.size || 2, t.size || 2);
        ctx.globalAlpha = 1;
        // Spread dust particles
        if (t.spread) { t.x += t.vx; t.y += t.vy; }
        return true;
      });

      // Update and draw sprites
      spritesRef.current.forEach((sprite, agentName) => {
        const elapsed = (now - sprite.startTime) / 1000;

        if (sprite.phase === "flying") {
          updateSpritePhysics(sprite, elapsed, canvas, now);
        } else if (sprite.phase === "victory") {
          const spinElapsed = (now - sprite.phaseStart) / 1000;
          sprite.rotation = spinElapsed * Math.PI * 6; // 3 full rotations/sec
          if (spinElapsed > 0.6) {
            sprite.phase = "exiting";
            sprite.phaseStart = now;
          }
        } else if (sprite.phase === "exiting") {
          sprite.x += sprite.vx * 3;
          sprite.y += sprite.vy * 3;
          if (sprite.x < -100 || sprite.x > canvas.width + 100 ||
              sprite.y < -100 || sprite.y > canvas.height + 100) {
            spritesRef.current.delete(agentName);
            return;
          }
        } else if (sprite.phase === "flash_red") {
          const flashElapsed = (now - sprite.phaseStart) / 1000;
          const flashCount = Math.floor(flashElapsed * 10);
          sprite.flashOn = (flashCount % 2 === 0);
          if (flashElapsed < 0.6) {
            sprite.scale = 1;
          } else {
            sprite.scale = Math.max(0, 1 - (flashElapsed - 0.6) * 5);
            if (sprite.scale === 0) {
              spritesRef.current.delete(agentName);
              return;
            }
          }
        }

        // Draw character-specific effects
        drawCharacterEffects(ctx, sprite, elapsed, now);

        // Draw sprite
        drawSprite(ctx, sprite, now);
      });

      animationRef.current = requestAnimationFrame(animate);
    };

    const updateSpritePhysics = (sprite, elapsed, canvas, now) => {
      const char = sprite.character;

      if (char === "IRON_MAN") {
        // Figure-8 loop
        if (!sprite.loopPhase) sprite.loopPhase = 0;
        sprite.loopPhase += 0.015;
        const centerX = canvas.width / 2;
        const centerY = canvas.height * 0.3;
        const radiusX = 300;
        const radiusY = 150;
        const newX = centerX + Math.sin(sprite.loopPhase) * radiusX;
        const newY = centerY + Math.sin(sprite.loopPhase * 2) * radiusY;
        sprite.vx = newX - sprite.x;
        sprite.vy = newY - sprite.y;
        sprite.x = newX;
        sprite.y = newY;
        sprite.rotation = Math.atan2(sprite.vy, sprite.vx);
        // Thruster trail
        if (Math.random() < 0.6) {
          trailsRef.current.push({ x: sprite.x + 24, y: sprite.y + 24, color: "#FF4500", opacity: 0.8, life: 20, maxLife: 20, size: 3 });
        }
      } else if (char === "THOR") {
        // Sweeping arcs with redirection
        if (!sprite.nextRedirect) sprite.nextRedirect = now + 2000;
        if (now >= sprite.nextRedirect) {
          sprite.vx = (Math.random() - 0.5) * 6;
          sprite.vy = (Math.random() - 0.5) * 6;
          sprite.nextRedirect = now + 2000;
          // Lightning burst
          for (let i = 0; i < 8; i++) {
            trailsRef.current.push({
              x: sprite.x + 24 + (Math.random() - 0.5) * 30,
              y: sprite.y + 24 + (Math.random() - 0.5) * 30,
              color: "#FFFF00",
              opacity: 1,
              life: 30,
              maxLife: 30,
              size: 2,
            });
          }
        }
        sprite.x += sprite.vx;
        sprite.y += sprite.vy;
        // Boundary bounce
        if (sprite.x < 50) { sprite.x = 50; sprite.vx = Math.abs(sprite.vx); }
        if (sprite.x > canvas.width - 50) { sprite.x = canvas.width - 50; sprite.vx = -Math.abs(sprite.vx); }
        if (sprite.y < 50) { sprite.y = 50; sprite.vy = Math.abs(sprite.vy); }
        if (sprite.y > canvas.height - 50) { sprite.y = canvas.height - 50; sprite.vy = -Math.abs(sprite.vy); }
        sprite.rotation = Math.atan2(sprite.vy, sprite.vx);
        // Lightning trail
        if (Math.random() < 0.4) {
          trailsRef.current.push({ x: sprite.x + 24, y: sprite.y + 24, color: "#FFFF00", opacity: 0.7, life: 30, maxLife: 30, size: 2 });
        }
      } else if (char === "SPIDER_MAN") {
        // Pendulum swing
        if (!sprite.anchorX) {
          sprite.anchorX = canvas.width * 0.3;
          sprite.anchorY = 60;
          sprite.swingAngle = 0;
          sprite.swingVel = 0.05;
        }
        sprite.anchorX += 0.3;
        const wrapPoint = canvas.width * 0.8;
        if (sprite.anchorX > wrapPoint) sprite.anchorX = canvas.width * 0.2;
        const radius = 180;
        sprite.swingAngle += sprite.swingVel;
        sprite.x = sprite.anchorX + Math.sin(sprite.swingAngle) * radius;
        sprite.y = sprite.anchorY + Math.cos(sprite.swingAngle) * radius;
        sprite.rotation = sprite.swingAngle;
      } else if (char === "HULK") {
        // Running with jumps
        if (!sprite.onGround) sprite.onGround = true;
        if (!sprite.nextJump) sprite.nextJump = now + 4000;
        const groundY = canvas.height - 80;
        if (sprite.onGround) {
          sprite.y = groundY;
          sprite.vy = 0;
          sprite.x += sprite.vx;
          if (sprite.x < 0) { sprite.x = 0; sprite.vx = 4; }
          if (sprite.x > canvas.width - 48) { sprite.x = canvas.width - 48; sprite.vx = -4; }
          if (now >= sprite.nextJump) {
            sprite.vy = -12;
            sprite.onGround = false;
            sprite.nextJump = now + 4000;
          }
        } else {
          sprite.vy += 0.5; // gravity
          sprite.y += sprite.vy;
          sprite.x += sprite.vx * 0.8;
          if (sprite.y >= groundY) {
            sprite.y = groundY;
            sprite.onGround = true;
            sprite.squashFrames = 5;
            // Dust puffs
            for (let i = 0; i < 6; i++) {
              trailsRef.current.push({
                x: sprite.x + 24 + (Math.random() - 0.5) * 20,
                y: sprite.y + 48,
                vx: (Math.random() - 0.5) * 2,
                vy: -Math.random() * 2,
                color: "#A0A0A0",
                opacity: 0.6,
                life: 25,
                maxLife: 25,
                size: 3,
                spread: true,
              });
            }
          }
        }
        sprite.rotation = 0;
        if (sprite.squashFrames && sprite.squashFrames > 0) sprite.squashFrames--;
      } else if (char === "CAPTAIN_AMERICA") {
        // Running with shield throw
        if (!sprite.shieldOut) sprite.shieldOut = false;
        if (!sprite.nextThrow) sprite.nextThrow = now + 3000;
        sprite.x += sprite.vx * (sprite.shieldOut ? 0.6 : 1);
        if (sprite.x < 0) { sprite.x = 0; sprite.vx = 3; }
        if (sprite.x > canvas.width - 48) { sprite.x = canvas.width - 48; sprite.vx = -3; }
        sprite.y = canvas.height - 100;
        sprite.rotation = 0;
        if (!sprite.shieldOut && now >= sprite.nextThrow) {
          sprite.shieldOut = true;
          sprite.shield = { x: sprite.x + 24, y: sprite.y + 24, vx: sprite.vx > 0 ? 8 : -8, vy: -2, phase: 0 };
          sprite.nextThrow = now + 3000;
        }
      } else if (char === "BLACK_WIDOW") {
        // Fast with direction changes and flips
        if (!sprite.nextFlip) sprite.nextFlip = now + (1000 + Math.random() * 1000);
        sprite.x += sprite.vx;
        sprite.y += sprite.vy;
        if (sprite.x < 0 || sprite.x > canvas.width - 48) sprite.vx = -sprite.vx;
        if (sprite.y < 0 || sprite.y > canvas.height - 48) sprite.vy = -sprite.vy;
        if (now >= sprite.nextFlip) {
          sprite.vx = (Math.random() - 0.5) * 8;
          sprite.vy = (Math.random() - 0.5) * 8;
          sprite.flipping = true;
          sprite.flipStart = now;
          sprite.nextFlip = now + (1000 + Math.random() * 1000);
        }
        sprite.rotation = Math.atan2(sprite.vy, sprite.vx);
        if (sprite.flipping && now - sprite.flipStart > 300) sprite.flipping = false;
        // Motion blur
        sprite.trail = sprite.trail || [];
        sprite.trail.push({ x: sprite.x, y: sprite.y });
        if (sprite.trail.length > 3) sprite.trail.shift();
      } else if (char === "HAWKEYE") {
        // Methodical movement with arrow shots
        if (!sprite.nextShoot) sprite.nextShoot = now + 2500;
        if (!sprite.moving) sprite.moving = true;
        if (sprite.moving) {
          sprite.x += sprite.vx;
          if (sprite.x < 0 || sprite.x > canvas.width - 48) sprite.vx = -sprite.vx;
          sprite.y = canvas.height * 0.6;
          if (now >= sprite.nextShoot) {
            sprite.moving = false;
            sprite.drawingBow = true;
            sprite.shootStart = now;
          }
        }
        if (sprite.drawingBow && now - sprite.shootStart > 500) {
          sprite.drawingBow = false;
          sprite.arrow = { x: sprite.x + 24, y: sprite.y + 24, vx: sprite.vx > 0 ? 12 : -12, life: 60 };
          sprite.nextShoot = now + 2500;
          sprite.moving = true;
        }
        sprite.rotation = 0;
      } else if (char === "VISION") {
        // Slow sine wave float
        if (!sprite.floatPhase) sprite.floatPhase = 0;
        sprite.floatPhase += 0.01;
        sprite.x += 1.5;
        if (sprite.x > canvas.width + 48) sprite.x = -48;
        sprite.y = canvas.height / 2 + Math.sin(sprite.floatPhase) * 80;
        sprite.phaseOpacity = 0.7 + Math.sin(elapsed * 2) * 0.3;
        sprite.rotation = 0;
      }
    };

    const drawCharacterEffects = (ctx, sprite, elapsed, now) => {
      const char = sprite.character;

      // Spider-Man web line
      if (char === "SPIDER_MAN" && sprite.anchorX) {
        ctx.strokeStyle = "#888888";
        ctx.lineWidth = 1;
        ctx.globalAlpha = 0.4;
        ctx.beginPath();
        ctx.moveTo(sprite.anchorX, sprite.anchorY);
        ctx.lineTo(sprite.x + 24, sprite.y + 24);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // Captain America shield
      if (char === "CAPTAIN_AMERICA" && sprite.shield) {
        const s = sprite.shield;
        s.phase += 0.2;
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.1; // arc
        // Draw shield
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.phase);
        ctx.fillStyle = "#DC143C";
        ctx.beginPath();
        ctx.arc(0, 0, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#FFFFFF";
        ctx.beginPath();
        ctx.arc(0, 0, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#0000FF";
        ctx.beginPath();
        ctx.arc(0, 0, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        // Check if shield returns
        const dist = Math.hypot(s.x - (sprite.x + 24), s.y - (sprite.y + 24));
        if (dist > 200 || s.y > canvas.height) {
          s.vx = -s.vx * 0.8;
          s.vy = -Math.abs(s.vy) * 0.5;
        }
        if (dist < 20) sprite.shield = null;
      }

      // Black Widow motion blur
      if (char === "BLACK_WIDOW" && sprite.trail) {
        sprite.trail.forEach((t, i) => {
          ctx.globalAlpha = (i + 1) / sprite.trail.length * 0.2;
          drawSpriteAt(ctx, sprite, t.x, t.y, 1);
        });
        ctx.globalAlpha = 1;
      }

      // Hawkeye arrow
      if (char === "HAWKEYE" && sprite.arrow) {
        const a = sprite.arrow;
        a.x += a.vx;
        a.life--;
        ctx.fillStyle = "#8B4513";
        ctx.globalAlpha = a.life / 60;
        ctx.fillRect(a.x, a.y, 8, 2);
        ctx.globalAlpha = 1;
        if (a.life <= 0 || a.x < 0 || a.x > canvas.width) sprite.arrow = null;
      }
    };

    animate();

    return () => {
      window.removeEventListener("resize", resize);
      if (animationRef.current) cancelAnimationFrame(animationRef.current);
    };
  }, []);

  // Handle agent events
  useEffect(() => {
    if (!agentEvents) return;

    if (agentEvents.type === "agent_start") {
      const avenger = AGENT_TO_AVENGER[agentEvents.agent] || 'HULK'; // Fallback to Hulk
      console.log('Spawning', avenger, 'for', agentEvents.agent);

      // Verify sprite exists
      if (!AVENGER_SPRITES[avenger]) {
        console.error('No sprite defined for', avenger);
        return;
      }

      // Character-specific initialization
      let x, y, vx, vy;
      const w = window.innerWidth;
      const h = window.innerHeight;

      if (avenger === "IRON_MAN") {
        // Offset architect vs coder so both are visible
        const isArchitect = agentEvents.agent === "architect";
        x = isArchitect ? w / 2 - 150 : w / 2 + 150;
        y = h * 0.3;
        vx = 0; vy = 0;
      } else if (avenger === "THOR") {
        x = Math.random() * w; y = Math.random() * h;
        vx = (Math.random() - 0.5) * 6; vy = (Math.random() - 0.5) * 6;
      } else if (avenger === "SPIDER_MAN") {
        x = 100; y = 150; vx = 0; vy = 0;
      } else if (avenger === "HULK") {
        x = Math.random() * w; y = h - 80;
        vx = Math.random() > 0.5 ? 4 : -4; vy = 0;
      } else if (avenger === "CAPTAIN_AMERICA") {
        x = 100; y = h - 100;
        vx = 3; vy = 0;
      } else if (avenger === "BLACK_WIDOW") {
        x = Math.random() * w; y = Math.random() * h;
        vx = (Math.random() - 0.5) * 8; vy = (Math.random() - 0.5) * 8;
      } else if (avenger === "HAWKEYE") {
        x = 100; y = h * 0.6;
        vx = 2; vy = 0;
      } else { // VISION
        x = -48; y = h / 2;
        vx = 1.5; vy = 0;
      }

      spritesRef.current.set(agentEvents.agent, {
        character: avenger,
        x, y, vx, vy,
        phase: "flying",
        startTime: Date.now(),
        agentName: agentEvents.agent,
        rotation: 0,
        scale: 1,
        flashOn: false,
      });
      console.log('Total sprites now:', spritesRef.current.size);
    } else if (agentEvents.type === "agent_done") {
      const sprite = spritesRef.current.get(agentEvents.agent);
      if (sprite && sprite.phase === "flying") {
        sprite.phase = "victory";
        sprite.phaseStart = Date.now();
      }
    } else if (agentEvents.type === "agent_timeout") {
      const sprite = spritesRef.current.get(agentEvents.agent);
      if (sprite && sprite.phase === "flying") {
        sprite.phase = "flash_red";
        sprite.phaseStart = Date.now();
      }
    } else if (agentEvents.type === "agents_clear") {
      spritesRef.current.clear();
      trailsRef.current = [];
    }
  }, [agentEvents]);

  const drawSpriteAt = (ctx, sprite, x, y, alpha) => {
    const pixels = AVENGER_SPRITES[sprite.character];
    if (!pixels) return;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x + 24, y + 24);

    // Rotation (continuous for flight direction)
    if (sprite.rotation) ctx.rotate(sprite.rotation);

    // Mirror horizontally if moving left
    const facingLeft = sprite.vx < 0;
    if (facingLeft) ctx.scale(-1, 1);

    // Scale (for shrinking on timeout)
    if (sprite.scale !== 1) ctx.scale(sprite.scale, sprite.scale);

    // Flip (Black Widow)
    if (sprite.flipping) ctx.scale(1, -1);

    // Squash (Hulk landing)
    if (sprite.squashFrames && sprite.squashFrames > 0) {
      ctx.scale(1.3, 0.7);
    }

    ctx.translate(-24, -24);

    // Vision phasing
    if (sprite.phaseOpacity) ctx.globalAlpha = sprite.phaseOpacity;

    for (let row = 0; row < 16; row++) {
      for (let col = 0; col < 16; col++) {
        const color = pixels[row][col];
        if (color) {
          let fillColor = color;
          if (sprite.phase === "flash_red" && sprite.flashOn) fillColor = "#FF0000";
          ctx.fillStyle = fillColor;
          ctx.fillRect(col * PIXEL_SCALE, row * PIXEL_SCALE, PIXEL_SCALE, PIXEL_SCALE);
        }
      }
    }

    ctx.restore();
  };

  const drawSprite = (ctx, sprite, now) => {
    drawSpriteAt(ctx, sprite, sprite.x, sprite.y, 1);
  };

  return (
    <canvas
      ref={canvasRef}
      style={{
        position: "fixed",
        top: 0,
        left: 0,
        width: "100%",
        height: "100%",
        zIndex: 9999,
        pointerEvents: "none",
      }}
    />
  );
};

// ── App ────────────────────────────────────────────────────────────────────────
function App() {
  const skipBoot = new URLSearchParams(window.location.search).has("skipBoot");
  const [booted, setBooted] = useState(skipBoot);
  const [state, setState] = useState("standby");
  const [model, setModel] = useState("haiku");
  const [mode, setMode] = useState("voice");

  const onToggleModel = () => {
    const next = model === "haiku" ? "sonnet" : "haiku";
    setModel(next);
    send({ type: "set_model", value: next });
  };

  const onToggleMode = () => {
    const next = mode === "voice" ? "silent" : "voice";
    setMode(next);
    send({ type: "set_mode", value: next });
  };
  const [conv, setConv] = useState([]);
  const [agentStates, setAgentStates] = useState({});
  const [usage, setUsage] = useState(null);
  const [timers, setTimers] = useState([]);
  const [avengersEvent, setAvengersEvent] = useState(null);
  const { time, uptime } = useClock();

  const [positions, setPositions] = useState(() => {
    try {
      const saved = localStorage.getItem("jarvis_panel_positions");
      if (saved) return JSON.parse(saved);
    } catch {}
    return {
      system:       { x: 32, y: 70 },
      conversation: { x: 32, y: 360 },
      agents:       { x: 32, y: 820 },
      usage:        { x: 1600, y: 70 },
      spotify:      { x: 1600, y: 320 },
    };
  });
  const DEFAULT_SIZES = {
    system:       { w: 300, h: 380 },
    conversation: { w: 380, h: 440 },
    agents:       { w: 300, h: 360 },
    usage:        { w: 280, h: 320 },
    spotify:      { w: 240, h: 460 },
  };
  const [sizes, setSizes] = useState(() => {
    try {
      const saved = localStorage.getItem("jarvis_panel_sizes");
      if (saved) return { ...DEFAULT_SIZES, ...JSON.parse(saved) };
    } catch {}
    return DEFAULT_SIZES;
  });
  const resizePanel = (key) => (w, h) => {
    setSizes(s => {
      const next = { ...s, [key]: { w, h } };
      try { localStorage.setItem("jarvis_panel_sizes", JSON.stringify(next)); } catch {}
      return next;
    });
  };

  // Focus order — last entry sits on top. Click any panel to bring it forward.
  const PANEL_KEYS = ["system", "conversation", "agents", "usage", "spotify"];
  const [focusOrder, setFocusOrder] = useState(PANEL_KEYS);
  const focusPanel = useCallback((key) => {
    setFocusOrder(order => {
      if (order[order.length - 1] === key) return order;
      return [...order.filter(k => k !== key), key];
    });
  }, []);
  const zFor = (key) => 10 + focusOrder.indexOf(key);

  // Keep panels inside the viewport when the window shrinks or saved positions are off-screen.
  useEffect(() => {
    const clampAll = () => {
      setPositions(prev => {
        let changed = false;
        const next = { ...prev };
        for (const key of PANEL_KEYS) {
          const p = prev[key]; if (!p) continue;
          const s = sizes[key] || { w: 280, h: 280 };
          const pad = 8;
          const maxX = Math.max(pad, window.innerWidth  - s.w - pad);
          const maxY = Math.max(pad, window.innerHeight - s.h - pad);
          const nx = Math.min(Math.max(pad, p.x), maxX);
          const ny = Math.min(Math.max(pad, p.y), maxY);
          if (nx !== p.x || ny !== p.y) { next[key] = { x: nx, y: ny }; changed = true; }
        }
        if (changed) { try { localStorage.setItem("jarvis_panel_positions", JSON.stringify(next)); } catch {} }
        return changed ? next : prev;
      });
    };
    clampAll();
    window.addEventListener("resize", clampAll);
    return () => window.removeEventListener("resize", clampAll);
  }, [sizes]);
  const [isMobile, setIsMobile] = useState(() => window.innerWidth <= 768);
  const [panelsOn, setPanelsOn] = useState(() => {
    try {
      const saved = localStorage.getItem("jarvis_panels_open");
      if (saved) return JSON.parse(saved);
    } catch {}
    return { system: true, conversation: true, agents: false, usage: false, spotify: false };
  });
  const togglePanel = (key) => setPanelsOn(p => {
    const next = { ...p, [key]: !p[key] };
    try { localStorage.setItem("jarvis_panels_open", JSON.stringify(next)); } catch {}
    return next;
  });
  useEffect(() => {
    const w = window.innerWidth, h = window.innerHeight;
    const mobile = w <= 768;
    setIsMobile(mobile);
    if (!mobile) {
      // Only set defaults if no saved positions
      const saved = localStorage.getItem("jarvis_panel_positions");
      if (!saved) {
        setPositions({
          system:       { x: 32, y: 70 },
          conversation: { x: 32, y: 360 },
          agents:       { x: 32, y: h - 290 },
          usage:        { x: w - 312, y: 70 },
          spotify:      { x: w - 312, y: 320 },
        });
      }
    }
    const onResize = () => setIsMobile(window.innerWidth <= 768);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  const movePanel = (key) => (x, y) => {
    setPositions(p => {
      const next = { ...p, [key]: { x, y } };
      try { localStorage.setItem("jarvis_panel_positions", JSON.stringify(next)); } catch {}
      return next;
    });
  };

  const ts = () => { const n=new Date(),h=n.getHours()%12||12,m=n.getMinutes(),ap=n.getHours()>=12?"PM":"AM"; return `${h}:${String(m).padStart(2,"0")} ${ap}`; };

  const handleWS = useCallback((msg) => {
    switch (msg.type) {
      case "status":      setState(msg.value); break;
      case "model":       setModel(msg.value); break;
      // Legacy single-agent routing: {type:"agent", value:"career"} activates one
      // (others go idle); value:"" clears. Kept for backward compatibility.
      case "agent": {
        const v = msg.value || "";
        setAgentStates(prev => {
          const next = { ...prev };
          Object.keys(next).forEach(k => {
            if (next[k].status === "active") next[k] = { ...next[k], status: "idle", lastUsed: ts() };
          });
          if (v) next[v] = { status: "active", elapsed: null, lastUsed: prev[v]?.lastUsed || null };
          return next;
        });
        break;
      }
      // Parallel multi-agent events from agent_bus.py
      case "agent_start": {
        const a = msg.agent;
        console.log('agent_start received for:', a);
        console.log('mapped to:', AGENT_TO_AVENGER[a]);
        setAgentStates(prev => ({ ...prev, [a]: { status: "active", elapsed: null, lastUsed: prev[a]?.lastUsed || null } }));
        setAvengersEvent({ type: "agent_start", agent: a });
        break;
      }
      case "agent_done": {
        const a = msg.agent;
        setAgentStates(prev => ({ ...prev, [a]: { status: "done", elapsed: msg.elapsed, lastUsed: ts() } }));
        setAvengersEvent({ type: "agent_done", agent: a });
        break;
      }
      case "agent_timeout": {
        const a = msg.agent;
        setAgentStates(prev => ({ ...prev, [a]: { status: "timeout", elapsed: null, lastUsed: ts() } }));
        setAvengersEvent({ type: "agent_timeout", agent: a });
        break;
      }
      case "agents_clear": {
        setAgentStates(prev => {
          const next = {};
          Object.keys(prev).forEach(k => { next[k] = { ...prev[k], status: "idle" }; });
          return next;
        });
        setAvengersEvent({ type: "agents_clear" });
        break;
      }
      case "user_msg":    setConv(c => [...c, { role: "user",   text: msg.text, ts: ts() }]); break;
      case "jarvis_msg":  setConv(c => [...c, { role: "jarvis", text: msg.text, ts: ts() }]); break;
      case "clear_log":   setConv([]); break;
      case "usage":       setUsage(msg); break;
      case "set_timer":
        setTimers(t => [...t, {
          id:           msg.id || Date.now(),
          message:      msg.message,
          totalSeconds: msg.seconds,
          startedAt:    Date.now(),
        }]);
        break;
    }
  }, []);

  const { wsState, send } = useJarvisWS(handleWS);

  const onSilentSend = (text) => {
    setConv(c => [...c, { role: "user", text, ts: ts() }]);
    send({ type: "silent_input", text });
  };

  return (
    <div id="app" data-theme={model} data-state={state}>
      <div className="bg"></div>
      <div className="bg-grid"></div>
      <div className="bg-grid-fine"></div>
      <div className="bg-noise"></div>

      {!booted && <Boot onDone={() => setBooted(true)} />}

      {booted && (<>
        <AvengersCanvas agentEvents={avengersEvent} />

        <div className={`top-badge ${model === "sonnet" ? "show" : ""}`}>
          <span className="pip"></span>SONNET 4.6 ENGAGED
        </div>

        <div className="corner tl">
          <span>JARVIS · PHASE 5</span>
        </div>
        <div className="corner tr">
          <span className={`backend-pill ${wsState}`} title={`Backend ${wsState}`}>
            <span className="dot"></span>BACKEND {wsState.toUpperCase()}
          </span>
        </div>
        <div className="corner bl">EDWARD HADDAD · MAC STUDIO M4 MAX</div>
        <TopClock time={time} />



        <Ring state={state} />
        <div className="center-label">
          <div className="name">JARVIS</div>
          <div className="status">
            <span className="dot"></span>
            <span>{STATE_LABELS[state]}</span>
          </div>
        </div>

        <div className={isMobile ? "mobile-panels" : ""}>
          <SystemPanel       pos={positions.system}       size={sizes.system}       onDrag={movePanel("system")}       onResize={resizePanel("system")}       onFocus={() => focusPanel("system")}       z={zFor("system")}       uptime={uptime} time={time} model={model} mode={mode} wsState={wsState} onToggleModel={onToggleModel} onToggleMode={onToggleMode} visible={panelsOn.system} />
          <ConversationPanel pos={positions.conversation} size={sizes.conversation} onDrag={movePanel("conversation")} onResize={resizePanel("conversation")} onFocus={() => focusPanel("conversation")} z={zFor("conversation")} entries={conv} onSend={onSilentSend} visible={panelsOn.conversation} />
          <AgentPanel        pos={positions.agents}       size={sizes.agents}       onDrag={movePanel("agents")}       onResize={resizePanel("agents")}       onFocus={() => focusPanel("agents")}       z={zFor("agents")}       agents={agentStates} visible={panelsOn.agents} />
          <UsagePanel        pos={positions.usage}        size={sizes.usage}        onDrag={movePanel("usage")}        onResize={resizePanel("usage")}        onFocus={() => focusPanel("usage")}        z={zFor("usage")}        usage={usage} visible={panelsOn.usage} />
          <SpotifyPanel      pos={positions.spotify}      size={sizes.spotify}      onDrag={movePanel("spotify")}      onResize={resizePanel("spotify")}      onFocus={() => focusPanel("spotify")}      z={zFor("spotify")}      visible={panelsOn.spotify} />
        </div>

        <Dock panelsOn={panelsOn} onToggle={togglePanel} />

        {timers.length > 0 && (
          <div className="timer-stack">
            {timers.map(t => (
              <TimerPanel
                key={t.id}
                {...t}
                onDone={() => setTimers(ts => ts.filter(x => x.id !== t.id))}
              />
            ))}
          </div>
        )}

        <div className="tiny-warn">DESIGNED FOR FULLSCREEN · 1920 × 1080</div>
      </>)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
