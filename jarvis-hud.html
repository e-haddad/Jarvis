// Avengers Canvas Component
const HERO_HUE = {
  IRON_MAN: "#FFB020", THOR: "#7FB0E8", HULK: "#6BD46B",
  CAPTAIN_AMERICA: "#5A7FE0", SPIDER_MAN: "#FF5A66", BLACK_WIDOW: "#FF5A5A",
  HAWKEYE: "#A98BE6", VISION: "#FFD24A",
};

const AvengersCanvas = ({ agentEvents, contrails = true, nameplates = true, idlePatrol = true }) => {
  const canvasRef = useRef(null);
  const spritesRef = useRef(new Map()); // Map<agentName, sprite> - max 8 sprites
  const animationRef = useRef(null);
  const trailsRef = useRef([]); // Trail particles: { x, y, color, opacity, life, maxLife }
  const optsRef = useRef({});
  optsRef.current = { contrails, nameplates, idlePatrol };
  const patrolRef = useRef(null);
  const nextPatrolRef = useRef(Date.now() + 4000);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");

    // Resize canvas to match window
    const resize = () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    };
    resize();
    window.addEventListener("resize", resize);

    // Animation loop
    const animate = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const now = Date.now();

      // Update and draw trails
      trailsRef.current = trailsRef.current.filter(t => {
        t.life--;
        t.opacity = t.life / t.maxLife;
        if (t.life <= 0) return false;
        ctx.fillStyle = t.color;
        ctx.globalAlpha = t.opacity;
        if (t.glow) { ctx.shadowBlur = (t.size || 2) * 2.6; ctx.shadowColor = t.color; }
        ctx.fillRect(t.x, t.y, t.size || 2, t.size || 2);
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
        // Spread dust particles
        if (t.spread) { t.x += t.vx; t.y += t.vy; }
        return true;
      });

      // Idle patrol — when no real agents are active, a hero drifts slowly across
      if (optsRef.current.idlePatrol && spritesRef.current.size === 0) {
        if (!patrolRef.current && now >= nextPatrolRef.current) {
          const heroes = Object.keys(AVENGER_SPRITES);
          const character = heroes[Math.floor(Math.random() * heroes.length)];
          const fromLeft = Math.random() < 0.5;
          const px = AVENGER_SPRITES[character];
          patrolRef.current = {
            character, x: fromLeft ? -70 : canvas.width + 70,
            y: 90 + Math.random() * Math.max(40, canvas.height - 320),
            vx: fromLeft ? 1.05 : -1.05, vy: 0, rotation: 0, scale: 1, bob: Math.random() * 6,
            cx: px[0].length * PIXEL_SCALE / 2, cy: px.length * PIXEL_SCALE / 2,
          };
        }
      } else if (patrolRef.current && spritesRef.current.size > 0) {
        patrolRef.current = null;
      }
      if (patrolRef.current) {
        const p = patrolRef.current;
        p.x += p.vx;
        p.bob += 0.02;
        p.bobOffset = Math.sin(p.bob) * 3;
        p.rotation = Math.max(-0.18, Math.min(0.18, p.vx * 0.05));
        if (p.x < -130 || p.x > canvas.width + 130) {
          patrolRef.current = null;
          nextPatrolRef.current = now + 6000 + Math.random() * 9000;
        } else {
          if (optsRef.current.contrails && Math.random() < 0.5) {
            trailsRef.current.push({ x: p.x + p.cx + (Math.random() - 0.5) * 8, y: p.y + p.cy + (Math.random() - 0.5) * 8, color: HERO_HUE[p.character] || "#9fe9ff", opacity: 0.3, life: 16, maxLife: 16, size: 3, glow: true });
          }
          drawSpriteAt(ctx, p, p.x, p.y + (p.bobOffset || 0), 0.3);
        }
      }

      // Update and draw sprites
      spritesRef.current.forEach((sprite, agentName) => {
        const elapsed = (now - sprite.startTime) / 1000;

        if (sprite.phase === "flying") {
          updateSpritePhysics(sprite, elapsed, canvas, now);
        } else if (sprite.phase === "victory") {
          const spinElapsed = (now - sprite.phaseStart) / 1000;
          sprite.rotation = spinElapsed * Math.PI * 6; // 3 full rotations/sec
          if (spinElapsed > 0.6) {
            sprite.phase = "exiting";
            sprite.phaseStart = now;
          }
        } else if (sprite.phase === "exiting") {
          sprite.x += sprite.vx * 3;
          sprite.y += sprite.vy * 3;
          if (sprite.x < -100 || sprite.x > canvas.width + 100 ||
              sprite.y < -100 || sprite.y > canvas.height + 100) {
            spritesRef.current.delete(agentName);
            return;
          }
        } else if (sprite.phase === "flash_red") {
          const flashElapsed = (now - sprite.phaseStart) / 1000;
          const flashCount = Math.floor(flashElapsed * 10);
          sprite.flashOn = (flashCount % 2 === 0);
          if (flashElapsed < 0.6) {
            sprite.scale = 1;
          } else {
            sprite.scale = Math.max(0, 1 - (flashElapsed - 0.6) * 5);
            if (sprite.scale === 0) {
              spritesRef.current.delete(agentName);
              return;
            }
          }
        }

        // Hero-tinted engine contrail behind flyers
        if (optsRef.current.contrails && sprite.phase === "flying") {
          trailsRef.current.push({
            x: sprite.x + (sprite.cx || 24) + (Math.random() - 0.5) * 8,
            y: sprite.y + (sprite.cy || 36) + (Math.random() - 0.5) * 8,
            color: sprite.hue || "#9fe9ff", opacity: 0.5, life: 16, maxLife: 16, size: 4, glow: true,
          });
        }

        // Draw character-specific effects
        drawCharacterEffects(ctx, sprite, elapsed, now);

        // Draw sprite
        drawSprite(ctx, sprite, now);

        // Nameplate fades in beneath the sprite for its first ~1.8s
        if (optsRef.current.nameplates && sprite.phase === "flying") {
          drawNameplate(ctx, sprite, now);
        }
      });

      animationRef.current = requestAnimationFrame(animate);
    };

    const updateSpritePhysics = (sprite, elapsed, canvas, now) => {
      const char = sprite.character;
      const clampTilt = (v) => Math.max(-0.32, Math.min(0.32, v));

      if (char === "IRON_MAN") {
        // Smooth figure-8 flight — body stays upright with a gentle bank
        if (sprite.loopPhase === undefined) sprite.loopPhase = Math.PI / 2;
        sprite.loopPhase += 0.012;
        const centerX = canvas.width / 2;
        const centerY = canvas.height * 0.32;
        const radiusX = Math.min(320, canvas.width * 0.32);
        const radiusY = 130;
        const newX = centerX + Math.sin(sprite.loopPhase) * radiusX;
        const newY = centerY + Math.sin(sprite.loopPhase * 2) * radiusY;
        sprite.vx = newX - sprite.x;
        sprite.vy = newY - sprite.y;
        sprite.x = newX;
        sprite.y = newY;
        sprite.rotation = clampTilt(sprite.vx * 0.03);
        sprite.bobOffset = 0;
        // Repulsor thruster trail from the boots
        if (Math.random() < 0.7) {
          trailsRef.current.push({ x: sprite.x + 24 + (Math.random() - 0.5) * 10, y: sprite.y + 44, color: Math.random() < 0.5 ? "#FF6B1A" : "#FFD24A", opacity: 0.8, life: 18, maxLife: 18, size: 3 });
        }
      } else if (char === "THOR") {
        // Sweeping flight that eases between headings (no teleporting)
        if (sprite.tvx === undefined) { sprite.tvx = (Math.random() - 0.5) * 5; sprite.tvy = (Math.random() - 0.5) * 3; sprite.nextRedirect = now + 2600; }
        if (now >= sprite.nextRedirect) {
          sprite.tvx = (Math.random() - 0.5) * 6;
          sprite.tvy = (Math.random() - 0.5) * 3.2;
          sprite.nextRedirect = now + 2200 + Math.random() * 1400;
          // Lightning burst on redirect
          for (let i = 0; i < 6; i++) {
            trailsRef.current.push({
              x: sprite.x + 24 + (Math.random() - 0.5) * 28,
              y: sprite.y + 24 + (Math.random() - 0.5) * 28,
              color: "#FFF36B",
              opacity: 1,
              life: 26,
              maxLife: 26,
              size: 2,
            });
          }
        }
        // Soft steer away from edges, then ease velocity toward target
        const tmgn = 90;
        if (sprite.x < tmgn) sprite.tvx += 0.25;
        if (sprite.x > canvas.width - tmgn) sprite.tvx -= 0.25;
        if (sprite.y < tmgn) sprite.tvy += 0.25;
        if (sprite.y > canvas.height - tmgn) sprite.tvy -= 0.25;
        sprite.vx += (sprite.tvx - sprite.vx) * 0.05;
        sprite.vy += (sprite.tvy - sprite.vy) * 0.05;
        sprite.x += sprite.vx;
        sprite.y += sprite.vy;
        sprite.x = Math.max(20, Math.min(canvas.width - 60, sprite.x));
        sprite.y = Math.max(20, Math.min(canvas.height - 60, sprite.y));
        sprite.rotation = clampTilt(sprite.vx * 0.04);
        sprite.bobOffset = Math.sin(now / 240) * 2;
        // Lightning trail
        if (Math.random() < 0.35) {
          trailsRef.current.push({ x: sprite.x + 24, y: sprite.y + 30, color: "#FFF36B", opacity: 0.7, life: 26, maxLife: 26, size: 2 });
        }
      } else if (char === "SPIDER_MAN") {
        // Web-swing — a real pendulum arc that drifts across; body leans into the swing
        if (sprite.anchorX === undefined) {
          sprite.anchorX = canvas.width * 0.28;
          sprite.anchorY = 50;
          sprite.swingT = 0;
        }
        sprite.swingT += 0.045;
        sprite.anchorX += 0.9;
        if (sprite.anchorX > canvas.width * 0.82) { sprite.anchorX = canvas.width * 0.18; sprite.anchorY = 40 + Math.random() * 40; }
        const radius = 190;
        const swing = Math.sin(sprite.swingT) * 1.05; // pendulum angle (radians)
        sprite.x = sprite.anchorX + Math.sin(swing) * radius;
        sprite.y = sprite.anchorY + Math.cos(swing) * radius;
        sprite.vx = Math.cos(sprite.swingT); // sign drives facing direction
        sprite.rotation = clampTilt(swing * 0.6);
        sprite.bobOffset = 0;
      } else if (char === "HULK") {
        // Running with jumps
        if (!sprite.onGround) sprite.onGround = true;
        if (!sprite.nextJump) sprite.nextJump = now + 4000;
        const groundY = canvas.height - 80;
        if (sprite.onGround) {
          sprite.y = groundY;
          sprite.vy = 0;
          sprite.x += sprite.vx;
          if (sprite.x < 0) { sprite.x = 0; sprite.vx = 4; }
          if (sprite.x > canvas.width - 48) { sprite.x = canvas.width - 48; sprite.vx = -4; }
          if (now >= sprite.nextJump) {
            sprite.vy = -12;
            sprite.onGround = false;
            sprite.nextJump = now + 4000;
          }
        } else {
          sprite.vy += 0.5; // gravity
          sprite.y += sprite.vy;
          sprite.x += sprite.vx * 0.8;
          if (sprite.y >= groundY) {
            sprite.y = groundY;
            sprite.onGround = true;
            sprite.squashFrames = 5;
            // Dust puffs
            for (let i = 0; i < 6; i++) {
              trailsRef.current.push({
                x: sprite.x + 24 + (Math.random() - 0.5) * 20,
                y: sprite.y + 48,
                vx: (Math.random() - 0.5) * 2,
                vy: -Math.random() * 2,
                color: "#A0A0A0",
                opacity: 0.6,
                life: 25,
                maxLife: 25,
                size: 3,
                spread: true,
              });
            }
          }
        }
        sprite.rotation = 0;
        sprite.bobOffset = sprite.onGround ? -Math.abs(Math.sin(now / 110)) * 4 : 0;
        if (sprite.squashFrames && sprite.squashFrames > 0) sprite.squashFrames--;
      } else if (char === "CAPTAIN_AMERICA") {
        // Running with shield throw
        if (!sprite.shieldOut) sprite.shieldOut = false;
        if (!sprite.nextThrow) sprite.nextThrow = now + 3000;
        sprite.x += sprite.vx * (sprite.shieldOut ? 0.6 : 1);
        if (sprite.x < 0) { sprite.x = 0; sprite.vx = 3; }
        if (sprite.x > canvas.width - 48) { sprite.x = canvas.width - 48; sprite.vx = -3; }
        sprite.y = canvas.height - 100;
        sprite.rotation = 0;
        sprite.bobOffset = -Math.abs(Math.sin(now / 100)) * 3;
        if (!sprite.shieldOut && now >= sprite.nextThrow) {
          sprite.shieldOut = true;
          sprite.shield = { x: sprite.x + 24, y: sprite.y + 24, vx: sprite.vx > 0 ? 8 : -8, vy: -2, phase: 0 };
          sprite.nextThrow = now + 3000;
        }
      } else if (char === "BLACK_WIDOW") {
        // Agile darting with eased direction changes — stays upright, leans into turns
        if (sprite.tvx === undefined) { sprite.tvx = (Math.random() - 0.5) * 7; sprite.tvy = (Math.random() - 0.5) * 5; sprite.nextFlip = now + 1400 + Math.random() * 1200; }
        if (now >= sprite.nextFlip) {
          sprite.tvx = (Math.random() - 0.5) * 8;
          sprite.tvy = (Math.random() - 0.5) * 5;
          sprite.nextFlip = now + 1400 + Math.random() * 1400;
        }
        const wmgn = 70;
        if (sprite.x < wmgn) sprite.tvx += 0.4;
        if (sprite.x > canvas.width - wmgn) sprite.tvx -= 0.4;
        if (sprite.y < wmgn) sprite.tvy += 0.4;
        if (sprite.y > canvas.height - wmgn) sprite.tvy -= 0.4;
        sprite.vx += (sprite.tvx - sprite.vx) * 0.08;
        sprite.vy += (sprite.tvy - sprite.vy) * 0.08;
        sprite.x += sprite.vx;
        sprite.y += sprite.vy;
        sprite.x = Math.max(16, Math.min(canvas.width - 60, sprite.x));
        sprite.y = Math.max(16, Math.min(canvas.height - 60, sprite.y));
        sprite.rotation = clampTilt(sprite.vx * 0.05);
        sprite.bobOffset = 0;
        // Motion blur
        sprite.trail = sprite.trail || [];
        sprite.trail.push({ x: sprite.x, y: sprite.y });
        if (sprite.trail.length > 3) sprite.trail.shift();
      } else if (char === "HAWKEYE") {
        // Methodical movement with arrow shots
        if (!sprite.nextShoot) sprite.nextShoot = now + 2500;
        if (!sprite.moving) sprite.moving = true;
        if (sprite.moving) {
          sprite.x += sprite.vx;
          if (sprite.x < 0 || sprite.x > canvas.width - 48) sprite.vx = -sprite.vx;
          sprite.y = canvas.height * 0.6;
          if (now >= sprite.nextShoot) {
            sprite.moving = false;
            sprite.drawingBow = true;
            sprite.shootStart = now;
          }
        }
        if (sprite.drawingBow && now - sprite.shootStart > 500) {
          sprite.drawingBow = false;
          sprite.arrow = { x: sprite.x + 24, y: sprite.y + 24, vx: sprite.vx > 0 ? 12 : -12, life: 60 };
          sprite.nextShoot = now + 2500;
          sprite.moving = true;
        }
        sprite.rotation = 0;
        sprite.bobOffset = sprite.moving ? -Math.abs(Math.sin(now / 130)) * 3 : 0;
      } else if (char === "VISION") {
        // Slow sine wave float
        if (!sprite.floatPhase) sprite.floatPhase = 0;
        sprite.floatPhase += 0.01;
        sprite.x += 1.5;
        if (sprite.x > canvas.width + 48) sprite.x = -48;
        sprite.y = canvas.height / 2 + Math.sin(sprite.floatPhase) * 80;
        sprite.phaseOpacity = 0.7 + Math.sin(elapsed * 2) * 0.3;
        sprite.rotation = 0;
      }
    };

    const drawCharacterEffects = (ctx, sprite, elapsed, now) => {
      const char = sprite.character;

      // Spider-Man web line
      if (char === "SPIDER_MAN" && sprite.anchorX) {
        ctx.strokeStyle = "#888888";
        ctx.lineWidth = 1;
        ctx.globalAlpha = 0.4;
        ctx.beginPath();
        ctx.moveTo(sprite.anchorX, sprite.anchorY);
        ctx.lineTo(sprite.x + 24, sprite.y + 24);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // Captain America shield
      if (char === "CAPTAIN_AMERICA" && sprite.shield) {
        const s = sprite.shield;
        s.phase += 0.2;
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.1; // arc
        // Draw shield
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.phase);
        ctx.fillStyle = "#DC143C";
        ctx.beginPath();
        ctx.arc(0, 0, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#FFFFFF";
        ctx.beginPath();
        ctx.arc(0, 0, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#0000FF";
        ctx.beginPath();
        ctx.arc(0, 0, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        // Check if shield returns
        const dist = Math.hypot(s.x - (sprite.x + 24), s.y - (sprite.y + 24));
        if (dist > 200 || s.y > canvas.height) {
          s.vx = -s.vx * 0.8;
          s.vy = -Math.abs(s.vy) * 0.5;
        }
        if (dist < 20) sprite.shield = null;
      }

      // Black Widow motion blur
      if (char === "BLACK_WIDOW" && sprite.trail) {
        sprite.trail.forEach((t, i) => {
          ctx.globalAlpha = (i + 1) / sprite.trail.length * 0.2;
          drawSpriteAt(ctx, sprite, t.x, t.y, 1);
        });
        ctx.globalAlpha = 1;
      }

      // Hawkeye arrow
      if (char === "HAWKEYE" && sprite.arrow) {
        const a = sprite.arrow;
        a.x += a.vx;
        a.life--;
        ctx.fillStyle = "#8B4513";
        ctx.globalAlpha = a.life / 60;
        ctx.fillRect(a.x, a.y, 8, 2);
        ctx.globalAlpha = 1;
        if (a.life <= 0 || a.x < 0 || a.x > canvas.width) sprite.arrow = null;
      }
    };

    animate();

    return () => {
      window.removeEventListener("resize", resize);
      if (animationRef.current) cancelAnimationFrame(animationRef.current);
    };
  }, []);

  // Handle agent events
  useEffect(() => {
    if (!agentEvents) return;

    if (agentEvents.type === "agent_start") {
      const avenger = AGENT_TO_AVENGER[agentEvents.agent] || 'HULK'; // Fallback to Hulk
      console.log('Spawning', avenger, 'for', agentEvents.agent);

      // Verify sprite exists
      if (!AVENGER_SPRITES[avenger]) {
        console.error('No sprite defined for', avenger);
        return;
      }

      // Character-specific initialization
      let x, y, vx, vy;
      const w = window.innerWidth;
      const h = window.innerHeight;

      if (avenger === "IRON_MAN") {
        // Offset architect vs coder so both are visible
        const isArchitect = agentEvents.agent === "architect";
        x = isArchitect ? w / 2 - 150 : w / 2 + 150;
        y = h * 0.3;
        vx = 0; vy = 0;
      } else if (avenger === "THOR") {
        x = Math.random() * w; y = Math.random() * h;
        vx = (Math.random() - 0.5) * 6; vy = (Math.random() - 0.5) * 6;
      } else if (avenger === "SPIDER_MAN") {
        x = 100; y = 150; vx = 0; vy = 0;
      } else if (avenger === "HULK") {
        x = Math.random() * w; y = h - 80;
        vx = Math.random() > 0.5 ? 4 : -4; vy = 0;
      } else if (avenger === "CAPTAIN_AMERICA") {
        x = 100; y = h - 100;
        vx = 3; vy = 0;
      } else if (avenger === "BLACK_WIDOW") {
        x = Math.random() * w; y = Math.random() * h;
        vx = (Math.random() - 0.5) * 8; vy = (Math.random() - 0.5) * 8;
      } else if (avenger === "HAWKEYE") {
        x = 100; y = h * 0.6;
        vx = 2; vy = 0;
      } else { // VISION
        x = -48; y = h / 2;
        vx = 1.5; vy = 0;
      }

      const _sp = AVENGER_SPRITES[avenger];
      const _meta = AGENTS_LIST.find(a => a.id === agentEvents.agent);
      spritesRef.current.set(agentEvents.agent, {
        character: avenger,
        x, y, vx, vy,
        phase: "flying",
        startTime: Date.now(),
        agentName: agentEvents.agent,
        rotation: 0,
        scale: 1,
        flashOn: false,
        cx: _sp[0].length * PIXEL_SCALE / 2,
        cy: _sp.length * PIXEL_SCALE / 2,
        label: _meta ? _meta.name : agentEvents.agent.toUpperCase(),
        role: _meta ? _meta.desc : "",
        hue: HERO_HUE[avenger] || "#9fe9ff",
      });
      console.log('Total sprites now:', spritesRef.current.size);
    } else if (agentEvents.type === "agent_done") {
      const sprite = spritesRef.current.get(agentEvents.agent);
      if (sprite && sprite.phase === "flying") {
        sprite.phase = "victory";
        sprite.phaseStart = Date.now();
      }
    } else if (agentEvents.type === "agent_timeout") {
      const sprite = spritesRef.current.get(agentEvents.agent);
      if (sprite && sprite.phase === "flying") {
        sprite.phase = "flash_red";
        sprite.phaseStart = Date.now();
      }
    } else if (agentEvents.type === "agents_clear") {
      spritesRef.current.clear();
      trailsRef.current = [];
    }
  }, [agentEvents]);

  const drawSpriteAt = (ctx, sprite, x, y, alpha) => {
    const pixels = AVENGER_SPRITES[sprite.character];
    if (!pixels) return;
    const rows = pixels.length, cols = pixels[0].length;
    const halfW = (cols * PIXEL_SCALE) / 2, halfH = (rows * PIXEL_SCALE) / 2;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x + halfW, y + halfH);

    // Rotation (gentle banking while in flight)
    if (sprite.rotation) ctx.rotate(sprite.rotation);

    // Mirror horizontally if moving left
    const facingLeft = sprite.vx < 0;
    if (facingLeft) ctx.scale(-1, 1);

    // Scale (for shrinking on timeout)
    if (sprite.scale !== 1) ctx.scale(sprite.scale, sprite.scale);

    // Flip (Black Widow)
    if (sprite.flipping) ctx.scale(1, -1);

    // Squash (Hulk landing)
    if (sprite.squashFrames && sprite.squashFrames > 0) {
      ctx.scale(1.3, 0.7);
    }

    ctx.translate(-halfW, -halfH);

    // Vision phasing
    if (sprite.phaseOpacity) ctx.globalAlpha = sprite.phaseOpacity;

    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        const color = pixels[row][col];
        if (color) {
          let fillColor = color;
          if (sprite.phase === "flash_red" && sprite.flashOn) fillColor = "#FF0000";
          ctx.fillStyle = fillColor;
          ctx.fillRect(col * PIXEL_SCALE, row * PIXEL_SCALE, PIXEL_SCALE, PIXEL_SCALE);
        }
      }
    }

    ctx.restore();
  };

  const drawSprite = (ctx, sprite, now) => {
    drawSpriteAt(ctx, sprite, sprite.x, sprite.y + (sprite.bobOffset || 0), 1);
  };

  const drawNameplate = (ctx, s, now) => {
    const el = (now - s.startTime) / 1000;
    if (el > 1.8) return;
    let a = 1;
    if (el < 0.25) a = el / 0.25;
    else if (el > 1.4) a = Math.max(0, 1 - (el - 1.4) / 0.4);
    const cx = s.x + (s.cx || 24);
    const top = s.y + (s.cy ? s.cy * 2 : 72) + 8;
    const hue = s.hue || "#9fe9ff";
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.font = "600 11px ui-monospace, monospace";
    const nameW = ctx.measureText(s.label || "").width;
    ctx.font = "9px ui-monospace, monospace";
    const roleW = s.role ? ctx.measureText(s.role.toUpperCase()).width : 0;
    const w = Math.max(nameW, roleW) + 18;
    const h = s.role ? 31 : 19;
    const x = cx - w / 2;
    ctx.globalAlpha = a * 0.85;
    ctx.fillStyle = "rgba(5,7,13,0.85)";
    ctx.fillRect(x, top, w, h);
    ctx.globalAlpha = a * 0.55;
    ctx.strokeStyle = hue;
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, top + 0.5, w - 1, h - 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = hue;
    ctx.font = "600 11px ui-monospace, monospace";
    ctx.fillText(s.label || "", cx, top + 4);
    if (s.role) {
      ctx.globalAlpha = a * 0.72;
      ctx.fillStyle = "#b4becd";
      ctx.font = "9px ui-monospace, monospace";
      ctx.fillText(s.role.toUpperCase(), cx, top + 18);
    }
    ctx.restore();
  };

  return (
    <canvas
      ref={canvasRef}
      style={{
        position: "fixed",
        top: 0,
        left: 0,
        width: "100%",
        height: "100%",
        zIndex: 9999,
        pointerEvents: "none",
        background: "transparent",
      }}
    />
  );
};

// ── Metrics rail (left edge sparklines) ──────────────────────────────────────
function Spark({ data, w = 138, h = 30 }) {
  const max = Math.max(...data, 1), min = Math.min(...data, 0);
  const range = Math.max(1, max - min);
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((v - min) / range) * (h - 5) - 2.5;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const last = pts[pts.length - 1].split(",");
  return (
    <svg className="metric-spark" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none">
      <polyline points={`0,${h} ${pts.join(" ")} ${w},${h}`} fill="rgb(var(--accent-rgb) / 0.10)" stroke="none" />
      <polyline points={pts.join(" ")} fill="none" stroke="rgb(var(--accent-rgb))" strokeOpacity="0.85" strokeWidth="1.4" strokeLinejoin="round" strokeLinecap="round" />
      <circle cx={last[0]} cy={last[1]} r="1.8" fill="rgb(var(--accent-rgb))" />
    </svg>
  );
}

function MetricsRail({ activeCount }) {
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const N = 44;
  const [tokens, setTokens] = useState(() => Array(N).fill(0).map(() => 30 + Math.random() * 40));
  const [latency, setLatency] = useState(() => Array(N).fill(0).map(() => 36 + Math.random() * 24));
  const [agents, setAgents] = useState(() => Array(N).fill(0));
  const activeRef = useRef(activeCount);
  activeRef.current = activeCount;
  useEffect(() => {
    const id = setInterval(() => {
      const drift = activeRef.current > 0 ? 26 : 12;
      setTokens(a => [...a.slice(1), clamp(a[a.length - 1] + (Math.random() - 0.45) * drift, 4, 100)]);
      setLatency(a => [...a.slice(1), clamp(a[a.length - 1] + (Math.random() - 0.5) * 14, 18, 96)]);
      setAgents(a => [...a.slice(1), activeRef.current]);
    }, 700);
    return () => clearInterval(id);
  }, []);
  return (
    <div className="metrics-rail">
      <div className="metric">
        <div className="metric-head"><span>TOKENS/S</span><span className="metric-val">{Math.round(tokens[tokens.length - 1])}</span></div>
        <Spark data={tokens} />
      </div>
      <div className="metric">
        <div className="metric-head"><span>LATENCY</span><span className="metric-val">{Math.round(latency[latency.length - 1])}ms</span></div>
        <Spark data={latency} />
      </div>
      <div className="metric">
        <div className="metric-head"><span>ACTIVE AGENTS</span><span className="metric-val">{activeCount}</span></div>
        <Spark data={agents} />
      </div>
    </div>
  );
}

// ── App ────────────────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "spawnSeconds": 10,
  "spriteContrails": true,
  "spriteNameplates": true,
  "idlePatrol": true,
  "metricsRail": true,
  "convShimmer": true,
  "crt": true,
  "bootDiagnostics": true,
  "panelBrackets": true
}/*EDITMODE-END*/;

function App() {
  const skipBoot = new URLSearchParams(window.location.search).has("skipBoot");
  const [booted, setBooted] = useState(skipBoot);
  const [state, setState] = useState("standby");
  const [model, setModel] = useState("haiku");
  const [mode, setMode] = useState("voice");

  const onToggleModel = () => {
    const next = model === "haiku" ? "sonnet" : "haiku";
    setModel(next);
    send({ type: "set_model", value: next });
  };

  const onToggleMode = () => {
    const next = mode === "voice" ? "silent" : "voice";
    setMode(next);
    send({ type: "set_mode", value: next });
  };
  const [conv, setConv] = useState([]);
  const [agentStates, setAgentStates] = useState({});
  const activeCount = Object.values(agentStates).filter(s => s && s.status === "active").length;
  const [usage, setUsage] = useState(null);
  const [timers, setTimers] = useState([]);
  const [avengersEvent, setAvengersEvent] = useState(null);
  const [tweaks, setTweak] = useState(TWEAK_DEFAULTS);
  const demoTimersRef = useRef({});
  const { time, uptime } = useClock();

  // Pop an agent's hero sprite onto the HUD for the tweakable duration, then
  // let it exit gracefully (victory spin → fly off). Re-triggering resets it.
  const demoAgent = (id) => {
    const ms = (tweaks.spawnSeconds || 10) * 1000;
    if (demoTimersRef.current[id]) clearTimeout(demoTimersRef.current[id]);
    setAgentStates(prev => ({ ...prev, [id]: { status: "active", elapsed: null, lastUsed: prev[id]?.lastUsed || null } }));
    setAvengersEvent({ type: "agent_start", agent: id });
    demoTimersRef.current[id] = setTimeout(() => {
      setAvengersEvent({ type: "agent_done", agent: id });
      setAgentStates(prev => ({ ...prev, [id]: { status: "done", elapsed: (ms / 1000) + "s", lastUsed: ts() } }));
      delete demoTimersRef.current[id];
    }, ms);
  };
  const spawnAllAgents = () => AGENTS_LIST.forEach((a, i) => setTimeout(() => demoAgent(a.id), i * 220));
  const clearAgents = () => {
    Object.values(demoTimersRef.current).forEach(clearTimeout);
    demoTimersRef.current = {};
    setAvengersEvent({ type: "agents_clear" });
    setAgentStates({});
  };

  const [positions, setPositions] = useState(() => {
    try {
      const saved = localStorage.getItem("jarvis_panel_positions");
      if (saved) return JSON.parse(saved);
    } catch {}
    return {
      system:       { x: 32, y: 70 },
      conversation: { x: 32, y: 360 },
      agents:       { x: 32, y: 820 },
      usage:        { x: 1600, y: 70 },
      spotify:      { x: 1600, y: 320 },
    };
  });
  const DEFAULT_SIZES = {
    system:       { w: 300, h: 380 },
    conversation: { w: 380, h: 440 },
    agents:       { w: 300, h: 360 },
    usage:        { w: 280, h: 320 },
    spotify:      { w: 240, h: 460 },
  };
  const [sizes, setSizes] = useState(() => {
    try {
      const saved = localStorage.getItem("jarvis_panel_sizes");
      if (saved) return { ...DEFAULT_SIZES, ...JSON.parse(saved) };
    } catch {}
    return DEFAULT_SIZES;
  });
  const resizePanel = (key) => (w, h) => {
    setSizes(s => {
      const next = { ...s, [key]: { w, h } };
      try { localStorage.setItem("jarvis_panel_sizes", JSON.stringify(next)); } catch {}
      return next;
    });
  };

  // Focus order — last entry sits on top. Click any panel to bring it forward.
  const PANEL_KEYS = ["system", "conversation", "agents", "usage", "spotify"];
  const [focusOrder, setFocusOrder] = useState(PANEL_KEYS);
  const focusPanel = useCallback((key) => {
    setFocusOrder(order => {
      if (order[order.length - 1] === key) return order;
      return [...order.filter(k => k !== key), key];
    });
  }, []);
  const zFor = (key) => 10 + focusOrder.indexOf(key);

  // Keep panels inside the viewport when the window shrinks or saved positions are off-screen.
  useEffect(() => {
    const clampAll = () => {
      setPositions(prev => {
        let changed = false;
        const next = { ...prev };
        for (const key of PANEL_KEYS) {
          const p = prev[key]; if (!p) continue;
          const s = sizes[key] || { w: 280, h: 280 };
          const pad = 8;
          const maxX = Math.max(pad, window.innerWidth  - s.w - pad);
          const maxY = Math.max(pad, window.innerHeight - s.h - pad);
          const nx = Math.min(Math.max(pad, p.x), maxX);
          const ny = Math.min(Math.max(pad, p.y), maxY);
          if (nx !== p.x || ny !== p.y) { next[key] = { x: nx, y: ny }; changed = true; }
        }
        if (changed) { try { localStorage.setItem("jarvis_panel_positions", JSON.stringify(next)); } catch {} }
        return changed ? next : prev;
      });
    };
    clampAll();
    window.addEventListener("resize", clampAll);
    return () => window.removeEventListener("resize", clampAll);
  }, [sizes]);
  const [isMobile, setIsMobile] = useState(() => window.innerWidth <= 768);
  const [collapsed, setCollapsed] = useState(() => {
    try {
      const saved = localStorage.getItem("jarvis_panel_collapsed");
      if (saved) return JSON.parse(saved);
    } catch {}
    return {};
  });
  const toggleCollapse = (key) => {
    setCollapsed(prev => {
      const next = { ...prev, [key]: !prev[key] };
      try { localStorage.setItem("jarvis_panel_collapsed", JSON.stringify(next)); } catch {}
      return next;
    });
  };
  const [sleepMode, setSleepMode] = useState(false);
  const [panelsOn, setPanelsOn] = useState(() => {
    try {
      const saved = localStorage.getItem("jarvis_panels_open");
      if (saved) return JSON.parse(saved);
    } catch {}
    return { system: true, conversation: true, agents: false, usage: false, spotify: false };
  });
  const togglePanel = (key) => {
    setPanelsOn(p => {
      const next = { ...p, [key]: !p[key] };
      try { localStorage.setItem("jarvis_panels_open", JSON.stringify(next)); } catch {}
      return next;
    });
  };
  useEffect(() => {
    const w = window.innerWidth, h = window.innerHeight;
    const mobile = w <= 768;
    setIsMobile(mobile);
    if (!mobile) {
      // Only set defaults if no saved positions
      const saved = localStorage.getItem("jarvis_panel_positions");
      if (!saved) {
        setPositions({
          system:       { x: 32, y: 70 },
          conversation: { x: 32, y: 360 },
          agents:       { x: 32, y: h - 290 },
          usage:        { x: w - 312, y: 70 },
          spotify:      { x: w - 312, y: 320 },
        });
      }
    }
    const onResize = () => setIsMobile(window.innerWidth <= 768);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);

  const movePanel = (key) => (x, y) => {
    setPositions(p => {
      const next = { ...p, [key]: { x, y } };
      try { localStorage.setItem("jarvis_panel_positions", JSON.stringify(next)); } catch {}
      return next;
    });
  };

  const ts = () => { const n=new Date(),h=n.getHours()%12||12,m=n.getMinutes(),ap=n.getHours()>=12?"PM":"AM"; return `${h}:${String(m).padStart(2,"0")} ${ap}`; };

  const handleWS = useCallback((msg) => {
    switch (msg.type) {
      case "status":
        setState(msg.value);
        if (msg.value === "listening" && sleepMode) setSleepMode(false);
        break;
      case "model":       setModel(msg.value); break;
      // Legacy single-agent routing: {type:"agent", value:"career"} activates one
      // (others go idle); value:"" clears. Kept for backward compatibility.
      case "agent": {
        const v = msg.value || "";
        setAgentStates(prev => {
          const next = { ...prev };
          Object.keys(next).forEach(k => {
            if (next[k].status === "active") next[k] = { ...next[k], status: "idle", lastUsed: ts() };
          });
          if (v) next[v] = { status: "active", elapsed: null, lastUsed: prev[v]?.lastUsed || null };
          return next;
        });
        break;
      }
      // Parallel multi-agent events from agent_bus.py
      case "agent_start": {
        const a = msg.agent;
        console.log('agent_start received for:', a);
        console.log('mapped to:', AGENT_TO_AVENGER[a]);
        setAgentStates(prev => ({ ...prev, [a]: { status: "active", elapsed: null, lastUsed: prev[a]?.lastUsed || null } }));
        setAvengersEvent({ type: "agent_start", agent: a });
        break;
      }
      case "agent_done": {
        const a = msg.agent;
        setAgentStates(prev => ({ ...prev, [a]: { status: "done", elapsed: msg.elapsed, lastUsed: ts() } }));
        setAvengersEvent({ type: "agent_done", agent: a });
        break;
      }
      case "agent_timeout": {
        const a = msg.agent;
        setAgentStates(prev => ({ ...prev, [a]: { status: "timeout", elapsed: null, lastUsed: ts() } }));
        setAvengersEvent({ type: "agent_timeout", agent: a });
        break;
      }
      case "agents_clear": {
        setAgentStates(prev => {
          const next = {};
          Object.keys(prev).forEach(k => { next[k] = { ...prev[k], status: "idle" }; });
          return next;
        });
        setAvengersEvent({ type: "agents_clear" });
        break;
      }
      case "user_msg":    setConv(c => [...c, { role: "user",   text: msg.text, ts: ts() }]); break;
      case "jarvis_msg":  setConv(c => [...c, { role: "jarvis", text: msg.text, ts: ts() }]); break;
      case "clear_log":   setConv([]); break;
      case "usage":       setUsage(msg); break;
      case "set_timer":
        setTimers(t => [...t, {
          id:           msg.id || Date.now(),
          message:      msg.message,
          totalSeconds: msg.seconds,
          startedAt:    Date.now(),
        }]);
        break;
    }
  }, []);

  const { wsState, send } = useJarvisWS(handleWS);

  const onSilentSend = (text) => {
    setConv(c => [...c, { role: "user", text, ts: ts() }]);
    send({ type: "silent_input", text });
  };

  return (
    <div id="app" data-theme={model} data-state={state} data-fx-brackets={tweaks.panelBrackets ? "1" : "0"} data-sleep={sleepMode ? "true" : "false"}>
      <div className="bg"></div>
      <div className="bg-grid"></div>
      <div className="bg-grid-fine"></div>
      <div className="bg-noise"></div>
      <div className="scanline-overlay"></div>

      {!booted && <Boot onDone={() => setBooted(true)} detailed={tweaks.bootDiagnostics} />}

      {booted && (<>
        <AvengersCanvas agentEvents={avengersEvent} contrails={tweaks.spriteContrails} nameplates={tweaks.spriteNameplates} idlePatrol={tweaks.idlePatrol} />

        <div className={`top-badge ${model === "sonnet" ? "show" : ""}`}>
          <span className="pip"></span>SONNET 4.6 ENGAGED
        </div>

        <div className="corner tl">
          <span>JARVIS · PHASE 15</span>
        </div>
        <div className="corner tr">
          <span className={`backend-pill ${wsState}`} title={`Backend ${wsState}`}>
            <span className="dot"></span>BACKEND {wsState.toUpperCase()}
          </span>
        </div>
        <div className="corner bl">EDWARD HADDAD · MAC STUDIO M4 MAX</div>
        <TopClock time={time} />
        {tweaks.metricsRail && <MetricsRail activeCount={activeCount} />}



        <Ring state={state} />
        <div className="center-label">
          <div className="name">JARVIS</div>
          <div className="status">
            <span className="dot"></span>
            <span>{STATE_LABELS[state]}</span>
          </div>
        </div>

        <div className={isMobile ? "mobile-panels" : ""}>
          <SystemPanel       pos={positions.system}       size={sizes.system}       onDrag={movePanel("system")}       onResize={resizePanel("system")}       onFocus={() => focusPanel("system")}       z={zFor("system")}       uptime={uptime} time={time} model={model} mode={mode} wsState={wsState} onToggleModel={onToggleModel} onToggleMode={onToggleMode} visible={panelsOn.system} collapsed={collapsed.system} onToggleCollapse={() => toggleCollapse("system")} />
          <ConversationPanel pos={positions.conversation} size={sizes.conversation} onDrag={movePanel("conversation")} onResize={resizePanel("conversation")} onFocus={() => focusPanel("conversation")} z={zFor("conversation")} entries={conv} onSend={onSilentSend} visible={panelsOn.conversation} shimmer={tweaks.convShimmer} collapsed={collapsed.conversation} onToggleCollapse={() => toggleCollapse("conversation")} />
          <AgentPanel        pos={positions.agents}       size={sizes.agents}       onDrag={movePanel("agents")}       onResize={resizePanel("agents")}       onFocus={() => focusPanel("agents")}       z={zFor("agents")}       agents={agentStates} visible={panelsOn.agents} collapsed={collapsed.agents} onToggleCollapse={() => toggleCollapse("agents")} />
          <UsagePanel        pos={positions.usage}        size={sizes.usage}        onDrag={movePanel("usage")}        onResize={resizePanel("usage")}        onFocus={() => focusPanel("usage")}        z={zFor("usage")}        usage={usage} visible={panelsOn.usage} collapsed={collapsed.usage} onToggleCollapse={() => toggleCollapse("usage")} />
          <SpotifyPanel      pos={positions.spotify}      size={sizes.spotify}      onDrag={movePanel("spotify")}      onResize={resizePanel("spotify")}      onFocus={() => focusPanel("spotify")}      z={zFor("spotify")}      visible={panelsOn.spotify} collapsed={collapsed.spotify} onToggleCollapse={() => toggleCollapse("spotify")} />
        </div>

        <Dock panelsOn={panelsOn} onToggle={togglePanel} sleepMode={sleepMode} onToggleSleep={() => setSleepMode(!sleepMode)} />
        <div className="sleep-overlay"><div className="sleep-icon">💤</div></div>

        {timers.length > 0 && (
          <div className="timer-stack">
            {timers.map(t => (
              <TimerPanel
                key={t.id}
                {...t}
                onDone={() => setTimers(ts => ts.filter(x => x.id !== t.id))}
              />
            ))}
          </div>
        )}

        <div className="tiny-warn">DESIGNED FOR FULLSCREEN · 1920 × 1080</div>
      </>)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
